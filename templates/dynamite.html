<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>다이너마이트 낚시</title>
<style>
  html, body { margin: 0; height: 100%; color-scheme: dark; background: #0b1d26; overflow: hidden;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; cursor: crosshair; touch-action: none; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5, 15, 20, .74); color: #f4ead2; z-index: 5; }
  .overlay.hidden { display: none; }
  .panel { max-width: 420px; margin: 16px; padding: 22px 22px 18px; background: #13303b;
    border: 3px solid #f2c14e; box-shadow: 0 0 0 3px #0b1d26, 6px 6px 0 3px #000; text-align: center; }
  h1 { margin: 0 0 4px; font-size: 26px; color: #f2c14e; letter-spacing: 1px; }
  .sub { opacity: .75; font-size: 13px; margin-bottom: 14px; }
  ol { text-align: left; padding-left: 22px; margin: 0 0 12px; line-height: 1.65; font-size: 14px; }
  ol b { color: #ffb347; }
  .tip { font-size: 12.5px; opacity: .9; text-align: left; line-height: 1.6; background: #0d2530;
    padding: 8px 10px; margin-bottom: 16px; }
  button { font: inherit; font-weight: 700; font-size: 17px; padding: 10px 28px; background: #e8573f;
    color: #fff; border: 0; box-shadow: 0 4px 0 #8f2b1c; cursor: pointer; }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #8f2b1c; }
  .stats { font-size: 15px; line-height: 1.8; margin: 6px 0 16px; }
  .bigscore { font-size: 42px; font-weight: 800; color: #f2c14e; line-height: 1.1; }
  .newbest { color: #7fffb0; font-weight: 700; }
  a.home { display: inline-block; margin-top: 12px; color: #9cc; font-size: 12px; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button.ghost { background: #24505e; box-shadow: 0 4px 0 #0e2a33; }
  button.ghost:active { box-shadow: 0 1px 0 #0e2a33; }
  button.charm { background: #7b5cd6; box-shadow: 0 4px 0 #3e2a80; }
  button:disabled { opacity: .4; cursor: default; }
  .coins { color: #ffd76a; font-weight: 800; font-size: 15px; margin: 4px 0 12px; }
  /* 설명 패널: 모바일에서 손가락으로 위아래 스크롤 */
  .overlay { touch-action: pan-y; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
  .panel { max-height: calc(100% - 32px); overflow-y: auto; box-sizing: border-box;
    touch-action: pan-y; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  button.link { background: none; box-shadow: none; color: #9fd6e0; font-size: 14px; padding: 10px 8px 2px; text-decoration: underline; text-underline-offset: 3px; }
  button.link:active { transform: none; }
  .rule { min-height: 150px; display: flex; flex-direction: column; justify-content: center; gap: 8px; text-align: left;
    background: #0d2530; padding: 14px 14px; margin-bottom: 12px; font-size: 14px; line-height: 1.6; }
  .rule .big { font-size: 34px; text-align: center; line-height: 1; }
  .rule .hd { font-weight: 800; font-size: 16px; color: #f2c14e; text-align: center; }
  .rule b { color: #ffb347; }
  .dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
  .dots span { width: 8px; height: 8px; background: #24505e; }
  .dots span.on { background: #f2c14e; }
  .pager { display: flex; gap: 10px; justify-content: center; }
  .pager button { font-size: 15px; padding: 9px 16px; }
  @media (max-height: 440px) {
    .panel { margin: 8px; padding: 12px 14px; }
    h1 { font-size: 19px; }
    .rule { min-height: 0; padding: 10px 12px; gap: 4px; margin-bottom: 8px; font-size: 13px; }
    .rule .big { font-size: 24px; }
    .dots { margin-bottom: 8px; }
  }
  @media (max-width: 480px) {
    .panel { margin: 12px; padding: 18px 16px 16px; }
    h1 { font-size: 22px; }
    ol { font-size: 13.5px; }
    .tip { font-size: 12.5px; }
  }
  .item { display: flex; gap: 10px; align-items: center; text-align: left; background: #0d2530; padding: 9px 10px; margin-bottom: 8px; }
  .item .info { flex: 1; min-width: 0; }
  .item .nm { font-weight: 800; font-size: 14.5px; }
  .item .ds { font-size: 12px; opacity: .8; line-height: 1.45; }
  .item .lv { color: #f2c14e; font-size: 12px; letter-spacing: 2px; }
  .item button { font-size: 13.5px; padding: 7px 10px; white-space: nowrap; }
  .earn { color: #ffd76a; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="overlay" id="startOv">
  <div class="panel">
    <h1>💣 다이너마이트 낚시</h1>
    <div class="sub">물속 그림자를 읽고, 한 방에 터뜨려라</div>
    <ol>
      <li><b>누르면</b> 도화선에 불이 붙습니다</li>
      <li>누른 채 <b>뒤로 당겨</b> 조준합니다</li>
      <li><b>놓으면</b> 던집니다. 늦게 놓을수록 얕은 곳에서 터집니다</li>
    </ol>
    <div class="coins" id="startCoins"></div>
    <div class="btns"><button id="startBtn">시작</button><button class="ghost" data-shop>🪙 가게</button></div>
    <button class="link" id="rulesBtn">📖 자세한 규칙 보기</button>
    <a class="home" href="/">← PixelQuest로 돌아가기</a>
  </div>
</div>

<div class="overlay hidden" id="clearOv">
  <div class="panel">
    <h1 id="clearTitle">1일차 성공!</h1>
    <div class="bigscore" id="clearScore">0</div>
    <div class="stats" id="clearStats"></div>
    <div class="btns"><button id="nextBtn">다음 날</button><button class="ghost" data-shop>🪙 가게</button></div>
  </div>
</div>

<div class="overlay hidden" id="endOv">
  <div class="panel">
    <h1 id="endTitle">오늘의 조과</h1>
    <div class="bigscore" id="endScore">0</div>
    <div class="stats" id="endStats"></div>
    <div class="btns">
      <button class="charm" id="charmBtn" hidden>🧿 부적 사용: 오늘 다시</button>
      <button id="againBtn">다시 하기</button><button class="ghost" data-shop>🪙 가게</button>
    </div>
    <a class="home" href="/">← PixelQuest로 돌아가기</a>
  </div>
</div>

<div class="overlay hidden" id="rulesOv">
  <div class="panel">
    <h1>게임 규칙</h1>
    <div class="rule" id="ruleBody"></div>
    <div class="dots" id="ruleDots"></div>
    <div class="pager">
      <button class="ghost" id="rulePrev">‹ 이전</button>
      <button id="ruleNext">다음 ›</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="shopOv">
  <div class="panel">
    <h1>낚시 가게</h1>
    <div class="sub">산 장비는 게임이 끝나도 계속 남습니다</div>
    <div class="coins" id="shopCoins"></div>
    <div id="shopList"></div>
    <button class="ghost" id="shopClose">닫기</button>
  </div>
</div>

<script>
(() => {
'use strict';

// ===== 기본 설정 =====
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const buf = document.createElement('canvas'), b = buf.getContext('2d');          // 저해상도 픽셀 버퍼
const deepC = document.createElement('canvas'), dctx = deepC.getContext('2d');   // 깊은 그림자 (블러)
const shC = document.createElement('canvas'), sctx = shC.getContext('2d');       // 얕은 그림자

let FUSE = 4.0;          // 도화선 총 길이(초) — 장비로 늘어남
let R = 30;              // 폭발 치명 반경(px, 가상 해상도) — 장비로 늘어남
const DZ = 70;           // 깊이 1.0 = 70px 거리로 환산
const SINK = 0.45;       // 초당 가라앉는 깊이
const START_DYN = 6;                 // 하루에 받는 다이너마이트
const dayTarget = d => 250 + (d - 1) * 130;   // 그날 목표 점수
const daySpeed = d => Math.min(1.45, 1 + (d - 1) * 0.07);
const bigDelay = (a, b2) => rand(a, b2) * Math.max(0.45, 1 - (day - 1) * 0.12);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const angLerp = (a, b, t) => { const d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; return a + d * Math.min(1, t); };
function segDist(px, py, ax, ay, bx, by) {
  const vx = bx - ax, vy = by - ay, l2 = vx * vx + vy * vy || 1;
  const t = clamp(((px - ax) * vx + (py - ay) * vy) / l2, 0, 1);
  return Math.hypot(px - (ax + vx * t), py - (ay + vy * t));
}

let S = 3, VW = 200, VH = 300, SHORE = 270;
const player = { x: 100, y: 280, stun: 0, throwAnim: 0 };

function resize() {
  const W = cvs.clientWidth || innerWidth, H = cvs.clientHeight || innerHeight;
  S = Math.max(2, Math.floor(Math.min(W, H) / 200));
  VW = Math.ceil(W / S); VH = Math.ceil(H / S);
  SHORE = VH - 26;
  cvs.width = W; cvs.height = H;
  for (const c of [buf, deepC, shC]) { c.width = VW; c.height = VH; }
  player.x = Math.round(VW / 2); player.y = SHORE + 12;
}
addEventListener('resize', resize);
resize();

// 수면 반짝임 타일
const caustic = document.createElement('canvas'); caustic.width = caustic.height = 64;
(() => {
  const c = caustic.getContext('2d');
  c.strokeStyle = 'rgba(255,255,255,0.9)'; c.lineWidth = 1;
  for (let i = 0; i < 14; i++) {
    let x = rand(0, 64), y = rand(0, 64);
    c.beginPath(); c.moveTo(x, y);
    for (let k = 0; k < 4; k++) { x += rand(-8, 8); y += rand(-3, 3); c.lineTo(x, y); }
    c.stroke();
  }
})();
let causticPat = null;

// ===== 사운드 (WebAudio 합성) =====
let ac = null, noiseBuf = null, hiss = null, muted = false;
function ensureAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = 0.9;
    const g = ac.createGain(); g.gain.value = 0;
    src.connect(bp).connect(g).connect(ac.destination); src.start();
    hiss = { g, bp };
  } catch (e) { ac = null; }
}
function noiseBurst(dur, freq, vol, type = 'lowpass') {
  if (!ac || muted) return;
  const t = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = ac.createBiquadFilter(); f.type = type;
  f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.15), t + dur);
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(t); s.stop(t + dur + 0.05);
}
function tone(freq, dur, vol, type = 'square', slideTo = null, delay = 0) {
  if (!ac || muted) return;
  const t = ac.currentTime + delay;
  const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  light() { noiseBurst(0.15, 5000, 0.25, 'highpass'); },
  throw() { noiseBurst(0.18, 1800, 0.18, 'bandpass'); },
  splash() { noiseBurst(0.35, 2200, 0.3, 'bandpass'); tone(300, 0.12, 0.08, 'sine', 120); },
  boom(depth) {
    const dd = clamp(depth, 0, 1);
    noiseBurst(1.3, 1200 * (1 - dd * 0.65), 0.9);
    tone(70, 0.6, 0.55, 'sine', 28);
  },
  collect(i) { tone(660 + Math.min(i, 12) * 60, 0.07, 0.06, 'square', null, i * 0.035); },
  bad() { tone(220, 0.25, 0.15, 'square', 110); },
  rumble() { tone(46, 1.8, 0.45, 'sine', 30); noiseBurst(1.6, 200, 0.25); },
  click(z) {
    if (z === 0) { tone(320, 0.09, 0.14, 'square', 220); tone(320, 0.09, 0.14, 'square', 220, 0.11); }
    else tone(900 + (3 - z) * 260, 0.035, 0.14, 'square');
  },
  bonus() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.12, 0.08, 'square', null, i * 0.08)); },
};
function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

// ===== 게임 데이터 =====
const SPECIES = {
  crucian: { name: '붕어', len: 5, wid: 2.2, depth: [0.12, 0.4], pts: 10, speed: 20, count: [9, 14] },
  carp:    { name: '잉어', len: 8, wid: 3.2, depth: [0.4, 0.7], pts: 30, speed: 15, count: [5, 8] },
  catfish: { name: '메기', len: 12, wid: 4.2, depth: [0.72, 0.95], pts: 80, speed: 10, count: [2, 4] },
  tuna:    { name: '황다랑어', len: 12, wid: 3.4, depth: [0.25, 0.55], pts: 150, speed: 78, count: [3, 5] },
};
const SHADOW = '#05202a';

let state = 'menu';
let time = 0, score = 0, dyn = START_DYN, best = 0, bestDay = 0;
let day = 1, dayScore = 0, target = 250, nextBonus = 0;
let streak = 0, charmsLeft = 0, lastEndBlast = false;
let tunaT = 15, swimT = 25, swimmer = null, fatal = null;  // 황다랑어 떼, 튜브 탄 수영객, 즉사 사유

// ===== 영구 성장: 동전 + 장비 =====
const UPGRADES = [
  { id: 'bag',   name: '다이너마이트 가방', desc: '매일 받는 다이너마이트 +1', costs: [60, 160, 320] },
  { id: 'power', name: '화약 강화',         desc: '폭발 범위 +10%',            costs: [80, 200, 400] },
  { id: 'fuse',  name: '긴 도화선',         desc: '도화선 +0.6초 (구간이 넓어져 조절이 쉬움)', costs: [50, 150] },
  { id: 'charm', name: '재기의 부적',       desc: '목표 미달 때 그날을 한 번 더 (판마다)', costs: [250, 600] },
];
let meta = { coins: 0, up: { bag: 0, power: 0, fuse: 0, charm: 0 } };
try { const m = JSON.parse(localStorage.getItem('dynfish_meta') || 'null'); if (m && m.up) meta = { coins: m.coins | 0, up: Object.assign(meta.up, m.up) }; } catch (e) {}
function saveMeta() { try { localStorage.setItem('dynfish_meta', JSON.stringify(meta)); } catch (e) {} }
function applyUpgrades() { R = 30 * (1 + 0.1 * meta.up.power); FUSE = 4.0 + 0.6 * meta.up.fuse; }
const dailyDyn = () => START_DYN + meta.up.bag;
const streakMult = n => 1 + 0.25 * Math.min(n, 4);   // 연속 명중 점수 배율 (최대 x2)
applyUpgrades();
let schools = [], fish = [], bombs = [], parts = [], ripples = [], blasts = [], combos = [], texts = [];
let big = null, nextBig = 15, schoolSpawnT = 0;
let hold = null, shake = 0, flash = 0, ink = 0, endT = 0, banner = null;
let stats = {};

try { best = +localStorage.getItem('dynfish_best') || 0; bestDay = +localStorage.getItem('dynfish_bestday') || 0; } catch (e) {}

function newGame() {
  time = 0; score = 0; day = 1; nextBonus = 0; streak = 0;
  applyUpgrades(); charmsLeft = meta.up.charm;
  schools = []; fish = []; parts = []; ripples = []; blasts = []; texts = [];
  stats = { fish: 0, bestCombo: 0, catches: [], whaleHits: 0, kinds: { crucian: 0, carp: 0, catfish: 0, tuna: 0 } };
  ['crucian', 'crucian', 'carp', 'carp', 'catfish'].forEach(k => spawnSchool(k, false));
  startDay();
}

function startDay() {
  dyn = dailyDyn() + nextBonus; nextBonus = 0;
  dayScore = 0; target = dayTarget(day);
  bombs = []; combos = [];
  big = null; nextBig = bigDelay(14, 18); schoolSpawnT = 4;
  hold = null; shake = flash = ink = endT = 0;
  player.stun = 0; player.throwAnim = 0; player.dead = false;
  // 날이 갈수록 물고기 떼가 늘고 깊은 물고기 비중이 커진다
  while (schools.length < maxSchools()) spawnSchool(pickKind(), false);
  for (const sc of schools) sc.mult = daySpeed(day);
  banner = { str: `${day}일차 · 목표 ${target}점`, t: 2.8 };
  tunaT = rand(10, 18); swimT = firstSwimDelay(); swimmer = null; fatal = null;
  if (day === SWIM_DAY) banner = { str: `${day}일차 · 목표 ${target}점 · 오늘부터 수영객이 나옵니다`, t: 3.4 };
}
const maxSchools = () => 6 + Math.min(3, day - 1);
function pickKind() {
  const r = Math.random(), deep = Math.min(0.15, (day - 1) * 0.03);
  return r < 0.45 - deep ? 'crucian' : r < 0.82 - deep ? 'carp' : 'catfish';
}

function spawnSchool(kind, fromEdge) {
  const sp = SPECIES[kind];
  let x, y;
  if (fromEdge) {
    const left = Math.random() < 0.5;
    x = left ? -6 : VW + 6; y = rand(30, SHORE - 40);
  } else { x = rand(30, VW - 30); y = rand(25, SHORE - 45); }
  const s = { kind, sp, x, y, vx: 0, vy: 0, wa: fromEdge ? (x < 0 ? 0 : Math.PI) : rand(0, TAU),
    depth: rand(...sp.depth), td: rand(...sp.depth), dT: rand(3, 6), scared: 0, fish: [], mult: daySpeed(day) };
  s.depth = s.td;
  const n = Math.round(rand(...sp.count));
  const spread = 4 + Math.sqrt(n) * sp.len * 0.7;
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), r = Math.sqrt(Math.random()) * spread;
    const f = { school: s, kind, sp, x: x + Math.cos(a) * r, y: y + Math.sin(a) * r * 0.8, vx: 0, vy: 0,
      ox: Math.cos(a) * r, oy: Math.sin(a) * r * 0.8, dz: rand(-0.06, 0.06), depth: s.depth,
      ph: rand(0, TAU), ang: s.wa, panic: 0, state: 'swim', ft: 0 };
    s.fish.push(f); fish.push(f);
  }
  schools.push(s);
}

// ===== 황다랑어: 호수를 고속으로 가로지르는 떼 =====
function spawnTuna() {
  const left = Math.random() < 0.5;
  spawnSchool('tuna', true);
  const s = schools[schools.length - 1];
  s.transit = true; s.x = left ? -14 : VW + 14; s.y = rand(30, SHORE - 50);
  s.wa = (left ? 0 : Math.PI) + rand(-0.25, 0.25);
  for (const f of s.fish) { f.x = s.x + f.ox; f.y = s.y + f.oy; f.ang = s.wa; f.vx = Math.cos(s.wa) * 60; f.vy = Math.sin(s.wa) * 60; }
  banner = { str: '⚡ 무언가 빠르게 지나간다!', t: 1.6 };
  tone(1800, 0.25, 0.05, 'sine', 600);
}

// ===== 튜브 탄 수영객 =====
const SWIM_DAY = 3;   // 이 날부터 등장
// 등장 첫날 이전에는 나오지 않고, 나오는 날도 하루가 어느 정도 지난 뒤에 처음 나타난다
const firstSwimDelay = () => day < SWIM_DAY ? Infinity : rand(28, 42) * Math.max(0.6, 1 - (day - SWIM_DAY) * 0.1);
function spawnSwimmer() {
  const left = Math.random() < 0.5;
  swimmer = { x: left ? -10 : VW + 10, y: rand(28, SHORE - 60), dir: left ? 1 : -1, sp: rand(6, 9), t: 0, kick: 0 };
  banner = { str: '🛟 튜브 탄 수영객 등장! 절대 맞히지 마세요', t: 2.8 };
  tone(880, 0.12, 0.06, 'sine', null); tone(1100, 0.16, 0.06, 'sine', null, 0.14);
}
function updateSwimmer(dt) {
  if (!swimmer) {
    swimT -= dt;
    if (swimT <= 0 && !fatal) spawnSwimmer();
    return;
  }
  const w = swimmer;
  w.t += dt;
  if (w.dead) return;
  w.x += w.dir * w.sp * dt; w.y += Math.sin(w.t * 0.5) * 2 * dt;
  w.kick -= dt;
  if (w.kick <= 0) { // 발장구
    w.kick = rand(0.4, 0.9);
    for (let i = 0; i < 3; i++) parts.push({ x: w.x - w.dir * 7, y: w.y + 1, z: 0, vx: -w.dir * rand(4, 12), vy: rand(-4, 4), vz: rand(12, 25), life: 0.4, max: 0.4, type: 'drop' });
    ripples.push({ x: w.x, y: w.y, r: 6, max: 11, life: 0.8 });
  }
  if (w.x < -30 || w.x > VW + 30) { swimmer = null; swimT = rand(30, 50) * Math.max(0.6, 1 - (day - SWIM_DAY) * 0.1); }
}
function swimmerHit(ex) {
  if (!swimmer || swimmer.dead || fatal) return;
  const ed = Math.max(0, ex.depth), rr = ex.depth < 0 ? R * 0.7 : R;
  if (Math.hypot(ex.x - swimmer.x, ex.y - swimmer.y, ed * DZ) > rr + 4) return;
  // 살인: 튜브가 터지고 즉시 게임 오버
  const w = swimmer; w.dead = true;
  fatal = { reason: 'murder', t: 0 };
  hold = null;
  for (let i = 0; i < 16; i++) {
    const a = rand(0, TAU), sp = rand(20, 70);
    parts.push({ x: w.x, y: w.y, z: 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6, vz: rand(40, 110), life: 3, max: 3, type: 'gib',
      col: i % 2 ? '#ff5d8f' : '#ffffff', w: 2, h: 1, spin: rand(-12, 12), rot: 0 });
  }
  for (let i = 0; i < 4; i++) ripples.push({ x: w.x, y: w.y, r: i * 3, max: 26 + i * 6, life: 1.6 });
  texts.push(mkText(w.x, w.y - 16, '살인자', '#ff2b2b', 2.6, true));
  shake = Math.max(shake, 8);
  setTimeout(() => { sfx.bad(); tone(110, 1.2, 0.3, 'sawtooth', 55); }, 250);
  vibrate([300, 100, 300]);
}
function drawSwimmer() {
  const w = swimmer;
  if (!w || w.dead) return;
  const x = Math.round(w.x), y = Math.round(w.y + Math.sin(w.t * 2.2) * 0.6);
  b.fillStyle = 'rgba(0,30,40,0.25)'; b.beginPath(); b.ellipse(x + 1, y + 2, 8, 5, 0, 0, TAU); b.fill();
  // 튜브 (분홍/흰 줄무늬 고리)
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * TAU;
    b.fillStyle = i % 2 ? '#ff5d8f' : '#fff4f7';
    b.fillRect(Math.round(x + Math.cos(a) * 6) - 1, Math.round(y + Math.sin(a) * 4) - 1, 3, 2);
  }
  // 사람: 수영복, 팔, 얼굴, 긴 머리
  b.fillStyle = '#e23d5c'; b.fillRect(x - 2, y - 2, 4, 3);
  b.fillStyle = '#f1c27d';
  b.fillRect(x - 5, y - 2, 3, 1); b.fillRect(x + 2, y - 2, 3, 1);   // 튜브에 걸친 팔
  b.fillRect(x - 2, y - 6, 4, 4);                                   // 얼굴
  b.fillStyle = '#4a2c18';
  b.fillRect(x - 3, y - 7, 6, 2); b.fillRect(x - 3, y - 5, 1, 4); b.fillRect(x + 2, y - 5, 1, 4); // 머리카락
  b.fillStyle = '#222'; b.fillRect(x - 1 + (w.dir > 0 ? 1 : 0), y - 4, 1, 1);
  // 선글라스 반짝
  if ((w.t * 2 | 0) % 5 === 0) { b.fillStyle = '#fff'; b.fillRect(x + w.dir * 1, y - 5, 1, 1); }
}

// ===== 대형 생물 =====
function spawnBig() {
  const r = Math.random();
  const type = r < 0.42 ? 'shark' : r < 0.78 ? 'whale' : 'squid';
  const left = Math.random() < 0.5;
  if (type === 'shark') {
    big = { type, x: left ? -30 : VW + 30, y: rand(40, SHORE - 60), ang: left ? 0 : Math.PI, speed: 38,
      depth: 0.35, hp: 2, t: 0, leaveAt: rand(22, 30), eatCd: 0, len: 24, wid: 7, dead: false, flee: 0 };
  } else if (type === 'whale') {
    big = { type, x: left ? -60 : VW + 60, y: rand(50, SHORE - 70), dir: left ? 1 : -1, speed: 11,
      depth: 0.6, t: 0, len: 74, wid: 24, spoutT: rand(2, 4), dive: 0, hitCd: 0 };
  } else {
    big = { type, x: rand(VW * 0.3, VW * 0.7), y: rand(SHORE * 0.3, SHORE * 0.55), depth: 0.95, hp: 3,
      t: 0, life: 24, dead: false, riseT: 1.2, tents: [] };
    for (let i = 0; i < 5; i++) big.tents.push({ a: i / 5 * TAU + rand(-0.3, 0.3), rise: 0, state: 'down', ht: 0 });
    ink = 1.0;
  }
  sfx.rumble(); vibrate([60, 60, 120]);
  banner = { str: type === 'squid' ? '⚠ 물빛이 검게 변한다…' : '⚠ 거대한 그림자가 다가온다…', t: 2.6 };
}

function bigBody() { // 몸통 선분 (머리-꼬리)
  if (!big || big.type === 'squid') return null;
  const a = big.type === 'shark' ? big.ang : (big.dir > 0 ? 0 : Math.PI);
  const hx = Math.cos(a) * big.len / 2, hy = Math.sin(a) * big.len / 2;
  return [big.x - hx, big.y - hy, big.x + hx, big.y + hy];
}

function updateBig(dt) {
  if (!big) {
    nextBig -= dt;
    if (nextBig <= 0 && state === 'play') spawnBig();
    return;
  }
  big.t += dt;
  if (big.type === 'shark') {
    const B = big;
    if (B.dead) { B.depth -= dt * 0.6; if (B.depth <= 0) { B.depth = 0; B.ft = (B.ft || 0) + dt; if (B.ft > 1.4) finishBig(); } return; }
    B.depth = 0.28 + Math.sin(B.t * 0.8) * 0.17;
    let target = null;
    if (B.t > B.leaveAt) target = { x: B.x < VW / 2 ? -80 : VW + 80, y: B.y };
    else if (B.flee > 0) { B.flee -= dt; }
    else {
      let bd = 1e9;
      for (const s of schools) { const d = Math.hypot(s.x - B.x, s.y - B.y); if (d < bd && s.x > 0 && s.x < VW) { bd = d; target = s; } }
      if (!target) target = { x: VW / 2 + Math.sin(B.t * 0.3) * VW * 0.3, y: SHORE / 2 };
    }
    if (target) B.ang = angLerp(B.ang, Math.atan2(target.y - B.y, target.x - B.x), dt * 1.6);
    const sp = B.flee > 0 ? 75 : B.speed;
    B.x += Math.cos(B.ang) * sp * dt; B.y += Math.sin(B.ang) * sp * dt;
    B.y = clamp(B.y, 10, SHORE - 20);
    B.eatCd -= dt;
    if (B.eatCd <= 0) {
      const hx = B.x + Math.cos(B.ang) * B.len / 2, hy = B.y + Math.sin(B.ang) * B.len / 2;
      for (const f of fish) {
        if (f.state !== 'swim') continue;
        if (Math.hypot(f.x - hx, f.y - hy) < 8 && Math.abs(f.depth - B.depth) < 0.35) {
          f.state = 'eaten'; B.eatCd = 0.5; f.school.scared = 3;
          for (let i = 0; i < 4; i++) parts.push({ x: f.x, y: f.y, z: 0, vx: rand(-6, 6), vy: rand(-6, 6), vz: 0, life: 0.6, max: 0.6, type: 'bubble' });
          break;
        }
      }
    }
    if (Math.sin(B.t * 0.8) < -0.85 && Math.random() < dt * 3) ripples.push({ x: B.x, y: B.y, r: 2, max: 12, life: 0.8 });
    if (B.t > B.leaveAt && (B.x < -60 || B.x > VW + 60)) big = null, nextBig = bigDelay(16, 24);
  } else if (big.type === 'whale') {
    const B = big;
    B.hitCd -= dt;
    B.x += B.dir * B.speed * (B.dive > 0 ? 2.4 : 1) * dt;
    B.y += Math.sin(B.t * 0.4) * 3 * dt;
    if (B.dive > 0) { B.dive -= dt; B.depth = lerp(B.depth, 1, dt * 1.5); }
    else B.depth = 0.58 + Math.sin(B.t * 0.5) * 0.08;
    B.spoutT -= dt;
    if (B.spoutT <= 0 && B.dive <= 0 && B.x > 0 && B.x < VW) {
      B.spoutT = rand(3.5, 5.5);
      const hx = B.x + B.dir * B.len * 0.32;
      for (let i = 0; i < 18; i++) parts.push({ x: hx + rand(-2, 2), y: B.y + rand(-1, 1), z: 0, vx: rand(-6, 6) + B.dir * 3, vy: rand(-2, 2), vz: rand(35, 60), life: 1.3, max: 1.3, type: 'drop' });
      ripples.push({ x: hx, y: B.y, r: 3, max: 18, life: 1 });
    }
    if (B.x < -100 || B.x > VW + 100) big = null, nextBig = bigDelay(16, 24);
  } else if (big.type === 'squid') {
    const B = big;
    if (B.dead) { B.depth -= dt * 0.5; for (const t of B.tents) t.rise = Math.max(0, t.rise - dt); if (B.depth <= 0) { B.depth = 0; B.ft = (B.ft || 0) + dt; if (B.ft > 1.6) finishBig(); } return; }
    if (B.riseT > 0) { B.riseT -= dt; B.depth = lerp(B.depth, 0.78, dt * 1.5); }
    B.x += Math.sin(B.t * 0.35) * 6 * dt; B.y += Math.cos(B.t * 0.27) * 4 * dt;
    const leaving = B.t > B.life;
    if (leaving) { B.depth += dt * 0.25; if (B.depth > 1.3) { big = null; nextBig = bigDelay(16, 24); texts.push(mkText(VW / 2, SHORE / 2, '대왕오징어가 사라졌다…', '#c9a6ff', 1.2)); return; } }
    // 촉수 올라오기 사이클
    if (!leaving && B.riseT <= 0) {
      B.nextTent = (B.nextTent ?? 0.5) - dt;
      if (B.nextTent <= 0) {
        const down = B.tents.filter(t => t.state === 'down');
        if (down.length) { const t = down[Math.floor(Math.random() * down.length)]; t.state = 'up'; t.ht = rand(2.2, 3.0); }
        B.nextTent = rand(1.2, 2.2);
      }
    }
    for (const t of B.tents) {
      if (t.state === 'up') {
        t.rise = Math.min(1, t.rise + dt * 1.8);
        if (t.rise >= 1) { t.ht -= dt; if (t.ht <= 0 || leaving) t.state = 'retract'; }
        if (Math.random() < dt * 6) { const p = tentTip(t); ripples.push({ x: p.x + rand(-3, 3), y: p.y + rand(-3, 3), r: 1, max: 8, life: 0.5 }); }
      } else if (t.state === 'retract') {
        t.rise = Math.max(0, t.rise - dt * 1.2);
        if (t.rise <= 0) t.state = 'down';
      }
    }
  }
}
function tentTip(t) {
  const L = 22 + t.rise * 18;
  const a = t.a + Math.sin(big.t * 1.5 + t.a * 3) * 0.15;
  return { x: big.x + Math.cos(a) * L, y: big.y + Math.sin(a) * L * 0.8, depth: lerp(big.depth, 0.04, t.rise), a };
}
function finishBig() {
  const pts = big.type === 'shark' ? 500 : 1000;
  addScore(pts);
  sfx.bonus();
  stats.catches.push(big.type === 'shark' ? '상어' : '대왕오징어');
  texts.push(mkText(big.x, big.y - 8, '+' + pts, '#ffe066', 1.8, true));
  for (let i = 0; i < 4; i++) ripples.push({ x: big.x, y: big.y, r: i * 4, max: 30 + i * 6, life: 1.2 });
  big = null; nextBig = bigDelay(18, 26);
}

function bigHit(ex) {
  if (!big || big.dead) return;
  const ed = Math.max(0, ex.depth), rr = ex.depth < 0 ? R * 0.7 : R;
  if (big.type === 'shark' || big.type === 'whale') {
    const [ax, ay, bx, by] = bigBody();
    const hd = Math.max(0, segDist(ex.x, ex.y, ax, ay, bx, by) - big.wid / 2);
    const d = Math.hypot(hd, (big.depth - ed) * DZ);
    if (d > rr) return;
    if (big.type === 'shark') {
      big.hp--;
      if (big.hp <= 0) {
        big.dead = true; ex.kills += 3; ex.bigKill = true;
        texts.push(mkText(big.x, big.y, '상어 포획!', '#ff8a5b', 2, true));
      } else {
        big.flee = 2.5; big.ang = Math.atan2(big.y - ex.y, big.x - ex.x);
        texts.push(mkText(big.x, big.y, '명중! 한 발 더!', '#ff8a5b', 1.6));
      }
    } else if (big.hitCd <= 0) {
      big.hitCd = 2; big.dive = 6; stats.whaleHits++;
      addScore(-300); sfx.bad();
      texts.push(mkText(big.x, big.y, '고래는 보호종! -300', '#ff5b5b', 2.2, true));
    }
  } else if (big.type === 'squid') {
    let hit = Math.hypot(Math.hypot(ex.x - big.x, ex.y - big.y) - 6, (big.depth - ed) * DZ) < rr;
    for (const t of big.tents) {
      if (t.rise < 0.4) continue;
      const p = tentTip(t);
      const hd = Math.max(0, segDist(ex.x, ex.y, big.x, big.y, p.x, p.y) - 2);
      if (Math.hypot(hd, (p.depth - ed) * DZ) < rr) { hit = true; t.state = 'retract'; }
    }
    if (!hit) return;
    big.hp--;
    if (big.hp <= 0) { big.dead = true; ex.kills += 5; ex.bigKill = true; texts.push(mkText(big.x, big.y, '대왕오징어 격파!', '#c9a6ff', 2.2, true)); }
    else texts.push(mkText(big.x, big.y - 6, `촉수 명중! (${3 - big.hp}/3)`, '#c9a6ff', 1.6));
  }
}

// ===== 텍스트, 점수 =====
function mkText(x, y, str, col = '#fff', size = 1, pop = false) { return { x, y, str, col, size, t: 0, life: pop ? 1.8 : 1.2, pop }; }
function addScore(n) { score = Math.max(0, score + n); dayScore += n; }

// ===== 폭발 =====
function explode(x, y, depth) {
  const ex = { x, y, depth, kills: 0, pts: 0, t: 0, mult: streakMult(streak) };
  combos.push(ex);
  const ed = Math.max(0, depth), rr = depth < 0 ? R * 0.7 : R;
  for (const f of fish) {
    if (f.state !== 'swim') continue;
    const d = Math.hypot(f.x - x, f.y - y, (f.depth - ed) * DZ);
    if (d < rr) {
      f.state = 'rise'; f.ex = ex; ex.kills++; ex.pts += f.sp.pts;
    } else if (d < rr * 2.5) {
      const a = Math.atan2(f.y - y, f.x - x), sp = 70 * (1 - d / (rr * 2.5)) + 25;
      f.vx = Math.cos(a) * sp; f.vy = Math.sin(a) * sp; f.panic = rand(0.8, 1.4);
      f.school.scared = 4;
      f.school.wa = Math.atan2(f.school.y - y, f.school.x - x);
    }
  }
  bigHit(ex);
  swimmerHit(ex);
  // 연출
  const surf = 1 - clamp(ed, 0, 1);
  blasts.push({ x, y, depth, t: 0 });
  shake = Math.max(shake, 3 + surf * 5);
  flash = Math.max(flash, 0.25 + surf * 0.5);
  const n = Math.round(14 + surf * 34);
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(5, 30) * (0.4 + surf);
    parts.push({ x: x + rand(-3, 3), y: y + rand(-2, 2), z: 0, vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.7,
      vz: rand(40, 110) * (0.35 + surf * 0.8), life: rand(0.8, 1.5), max: 1.5, type: 'drop' });
  }
  if (depth < 0.08) for (let i = 0; i < 14; i++) parts.push({ x, y, z: 4, vx: rand(-25, 25), vy: rand(-18, 18), vz: rand(5, 40), life: rand(0.3, 0.6), max: 0.6, type: 'fire' });
  for (let i = 0; i < 3; i++) ripples.push({ x, y, r: 2 + i * 5, max: 34 + i * 10 + surf * 12, life: 1.1 + i * 0.2 });
  for (let i = 0; i < 12; i++) parts.push({ x: x + rand(-10, 10), y: y + rand(-8, 8), z: 0, vx: 0, vy: rand(-3, 3), vz: 0, life: rand(0.6, 1.4), max: 1.4, type: 'bubble' });
  sfx.boom(ed);
  vibrate(depth < 0.3 ? [80, 30, 60] : [50]);
}

function handBlast() {

  for (let i = 0; i < 18; i++) parts.push({ x: px + rand(-6, 6), y: py - 6 + rand(-4, 4), z: 0, vx: rand(-6, 6), vy: rand(-10, -2), vz: 0, life: rand(1.5, 2.8), max: 2.8, type: 'smoke' });

  if (hiss) hiss.g.gain.setTargetAtTime(0, ac.currentTime, 0.03);

function shade(hex) { // 조각 하나는 살짝 어둡게
  const n = parseInt(hex.slice(1), 16), f = 0.7;
  return `rgb(${(n >> 16 & 255) * f | 0},${(n >> 8 & 255) * f | 0},${(n & 255) * f | 0})`;
}

// ===== 도화선 구간 =====
const ZONES = [
  { name: '공중!', col: '#ff4b3a' },
  { name: '얕게', col: '#ffe066' },
  { name: '중간', col: '#ffa53a' },
  { name: '깊게', col: '#6fb6ff' },
];
const zoneOf = pd => pd < 0 ? 0 : pd < 0.4 ? 1 : pd < 0.7 ? 2 : 3;

// ===== 입력 =====
function aimInfo(h) {
  const dx = h.sx - h.cx, dy = h.sy - h.cy;
  const len = Math.hypot(dx, dy);
  const maxPull = Math.min(VW, VH) * 0.42;
  const p = clamp(len / maxPull, 0, 1);
  const ang = Math.atan2(dy, dx);
  const maxDist = Math.max(SHORE - 6, VW * 0.55);
  const dist = 14 + p * maxDist;
  const hx = player.x, hy = player.y - 6;
  let lx = hx + Math.cos(ang) * dist, ly = hy + Math.sin(ang) * dist;
  if (big && big.type === 'squid' && !big.dead) { lx += Math.sin(time * 2.7) * 7; ly += Math.cos(time * 2.1) * 4; }
  lx = clamp(lx, 4, VW - 4); ly = clamp(ly, 4, SHORE - 5);
  const fd = Math.hypot(lx - hx, ly - hy);
  const flight = 0.35 + fd / 230;
  const rem = h.fuse - flight;
  const pdepth = rem < 0 ? -0.05 : Math.min(1, rem * SINK);
  const flightEff = len < 4 ? 0.9 : flight; // 아직 안 당겼으면 중간 거리 기준
  const remEff = h.fuse - flightEff;
  const zone = zoneOf(remEff < 0 ? -0.05 : remEff * SINK);
  return { len, p, ang, lx, ly, hx, hy, fd, flight, flightEff, pdepth, zone };
}

function ptr(e) { const r = cvs.getBoundingClientRect(); return { x: (e.clientX - r.left) / S, y: (e.clientY - r.top) / S }; }
cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state !== 'play') return;
  ensureAudio();
  if (hold || player.stun > 0 || player.dead || fatal || dyn <= 0) return;
  try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
  const p = ptr(e);
  hold = { id: e.pointerId, sx: p.x, sy: p.y, cx: p.x, cy: p.y, fuse: FUSE };
  dyn--;
  sfx.light();
});
cvs.addEventListener('pointermove', e => {
  if (!hold || e.pointerId !== hold.id) return;
  const p = ptr(e); hold.cx = p.x; hold.cy = p.y;
});
function release(e) {
  if (!hold || e.pointerId !== hold.id) return;
  const h = hold; hold = null;
  const a = aimInfo(h);
  if (a.len < 6) { // 거의 안 당겼으면 취소
    dyn++;
    texts.push(mkText(player.x, player.y - 18, '불 끔', '#cfd8dc', 1));
    return;
  }
  bombs.push({ x: a.hx, y: a.hy, z: 0, sx: a.hx, sy: a.hy, tx: a.lx, ty: a.ly, t: 0, flight: a.flight,
    arc: 14 + a.fd * 0.22, state: 'air', fuse: h.fuse, depth: 0, wt: 0, spin: 0 });
  player.throwAnim = 0.3; player.lastAng = a.ang;
  sfx.throw();
}
cvs.addEventListener('pointerup', release);
cvs.addEventListener('pointercancel', release);
cvs.addEventListener('contextmenu', e => e.preventDefault());

// ===== 업데이트 =====
function update(dt) {
  time += dt;
  if (state !== 'play') { updateAmbient(dt); return; }

  if (player.stun > 0) player.stun -= dt;
  if (player.throwAnim > 0) player.throwAnim -= dt;

  if (hold) {
    hold.fuse -= dt;
    if (hold.fuse <= 0) { hold = null; handBlast(); }
    else {
      const z = aimInfo(hold).zone;
      if (hold.zone !== undefined && z !== hold.zone) {
        sfx.click(z); vibrate(z === 0 ? [30, 30, 30] : 18);
        hold.zonePop = 0.25;
      }
      hold.zone = z;
      if (hold.zonePop > 0) hold.zonePop -= dt;
    }
  }

  // 다이너마이트
  for (const bm of bombs) {
    bm.fuse -= dt;
    if (bm.state === 'air') {
      bm.t += dt; bm.spin += dt * 14;
      const u = Math.min(1, bm.t / bm.flight);
      bm.x = lerp(bm.sx, bm.tx, u); bm.y = lerp(bm.sy, bm.ty, u); bm.z = bm.arc * 4 * u * (1 - u);
      for (let i = 0; i < 2; i++) if (Math.random() < dt * 40) { const a = rand(0, TAU), sp = rand(8, 26); parts.push({ x: bm.x, y: bm.y, z: bm.z + 3, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6, vz: rand(0, 25), life: rand(0.15, 0.35), max: 0.35, type: 'spark' }); }
      if (Math.random() < dt * 25) parts.push({ x: bm.x, y: bm.y, z: bm.z + 3, vx: rand(-2, 2), vy: 0, vz: 0, life: 0.6, max: 0.6, type: 'wisp' });
      if (u >= 1 && bm.fuse > 0) {
        bm.state = 'water'; bm.z = 0;
        ripples.push({ x: bm.x, y: bm.y, r: 1, max: 14, life: 0.9 }, { x: bm.x, y: bm.y, r: 1, max: 8, life: 0.6 });
        for (let i = 0; i < 10; i++) parts.push({ x: bm.x, y: bm.y, z: 0, vx: rand(-14, 14), vy: rand(-10, 10), vz: rand(20, 45), life: 0.6, max: 0.6, type: 'drop' });
        sfx.splash();
      }
    } else {
      bm.wt += dt;
      bm.depth = Math.min(1, bm.wt * SINK);
      if (Math.random() < dt * 8) parts.push({ x: bm.x + rand(-2, 2), y: bm.y + rand(-2, 2), z: 0, vx: 0, vy: 0, vz: 0, life: 0.5, max: 0.5, type: 'bubble' });
    }
    if (bm.fuse <= 0) { bm.dead = true; explode(bm.x, bm.y, bm.state === 'air' ? -0.05 : bm.depth); }
  }
  bombs = bombs.filter(bm => !bm.dead);

  // 도화선 소리
  if (hiss && !muted) {
    const anyAir = bombs.some(b2 => b2.state === 'air'), anyWater = bombs.some(b2 => b2.state === 'water');
    let g = 0, f = 3200;
    if (hold) { const z = hold.zone ?? 3; g = z === 0 ? 0.1 : 0.07; f = 2600 + (1 - hold.fuse / FUSE) * 3500 + (z === 0 ? Math.sin(time * 40) * 900 : 0); }
    else if (anyAir) { g = 0.04; f = 3000; if (Math.random() < dt * 6) noiseBurst(0.02, 6500, 0.06, 'highpass'); }
    else if (anyWater) { g = 0.02; f = 700; }
    hiss.g.gain.setTargetAtTime(g, ac.currentTime, 0.03);
    hiss.bp.frequency.setTargetAtTime(f, ac.currentTime, 0.05);
  } else if (hiss) hiss.g.gain.setTargetAtTime(0, ac.currentTime, 0.03);

  updateSchools(dt);
  updateFish(dt);
  updateBig(dt);
  updateSwimmer(dt);
  tunaT -= dt;
  if (tunaT <= 0 && !fatal) { spawnTuna(); tunaT = rand(18, 30) * Math.max(0.5, 1 - (day - 1) * 0.08); }

  // 물고기 떼 보충
  schoolSpawnT -= dt;
  if (schoolSpawnT <= 0) {
    schoolSpawnT = rand(5, 8);
    if (schools.length < maxSchools()) spawnSchool(pickKind(), true);
  }

  // 콤보 판정
  for (const c of combos) {
    c.t += dt;
    if (c.t > 1.9 && !c.done) {
      c.done = true;
      stats.bestCombo = Math.max(stats.bestCombo, c.kills);
      let msg = null, col = '#fff';
      if (c.kills >= 15) { msg = `초대박!!! x${c.kills}`; col = '#ff5bd1'; }
      else if (c.kills >= 9) { msg = `대박!! x${c.kills}`; col = '#ffd23f'; }
      else if (c.kills >= 4) { msg = `좋아! x${c.kills}`; col = '#8fe3ff'; }
      else if (c.kills === 0 && c.depth >= 0) { msg = '꽝…'; col = '#9aa'; }
      if (msg) texts.push(mkText(c.x, c.y - 14, msg, col, c.kills >= 9 ? 1.8 : 1.3, c.kills >= 4));
      // 실력 보상: 한 방에 많이 잡으면 다이너마이트 환급
      const refund = (c.kills >= 12 ? 2 : c.kills >= 6 ? 1 : 0) + (c.bigKill ? 2 : 0);
      if (refund) {
        dyn += refund; sfx.bonus();
        texts.push(mkText(c.x, c.y + 4, `+${refund} 다이너마이트!`, '#ff9f43', 1.3, true));
      }
      // 연속 명중: 3마리 이상이면 이어지고, 아니면 끊긴다
      if (c.kills >= 3) {
        streak++;
        if (streak >= 2) texts.push(mkText(c.x, c.y + 14, `연속 ${streak}! 점수 x${streakMult(streak)}`, '#ffb3e6', 1.05));
      } else if (streak > 0) {
        if (streak >= 2) texts.push(mkText(c.x, c.y + 14, '연속 끊김', '#9aa', 0.95));
        streak = 0;
      }
    }
  }
  combos = combos.filter(c => !c.done);

  updateAmbient(dt);

  // 종료 판정: 손에서 터지면 곧바로 게임 오버
  if (player.dead) {
    player.deathT += dt;
    if (player.deathT > 2.4) endGame('blast');
    return;
  }
  if (fatal) { // 수영객을 터뜨림
    fatal.t += dt;
    if (fatal.t > 2.6) endGame(fatal.reason);
    return;
  }
  const busy = hold || bombs.length || combos.length || fish.some(f => f.state === 'rise' || f.state === 'float') || (big && big.dead);
  if (dyn <= 0 && !busy) { endT += dt; if (endT > 1.3) { if (dayScore >= target) dayClear(); else endGame(); } } else endT = 0;
}

function updateSchools(dt) {
  for (const s of schools) {
    s.fish = s.fish.filter(f => f.state === 'swim');
    if (!s.fish.length) { s.dead = true; continue; }
    s.scared = Math.max(0, s.scared - dt);
    if (s.transit) { // 황다랑어: 곧게 고속 질주 후 화면 밖으로
      const sp = s.sp.speed * s.mult * (s.scared > 0 ? 1.4 : 1);
      s.vx = lerp(s.vx, Math.cos(s.wa) * sp, dt * 3); s.vy = lerp(s.vy, Math.sin(s.wa) * sp, dt * 3);
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.y < 15 || s.y > SHORE - 30) s.wa = angLerp(s.wa, s.vx > 0 ? 0 : Math.PI, dt * 2);
      if (s.depth < 0.4 && Math.random() < dt * 10) ripples.push({ x: s.x, y: s.y, r: 1, max: 5, life: 0.4 });
      if (s.x < -50 || s.x > VW + 50) { for (const f of s.fish) f.state = 'gone'; s.dead = true; }
      continue;
    }
    s.wa += rand(-1, 1) * dt * 2.2;
    const m = 26, cx = VW / 2, cy = SHORE / 2;
    if (s.x < m || s.x > VW - m || s.y < m || s.y > SHORE - m - 10) s.wa = angLerp(s.wa, Math.atan2(cy - s.y, cx - s.x), dt * 3);
    if (big && !big.dead) {
      const d = Math.hypot(big.x - s.x, big.y - s.y);
      if (big.type === 'whale' && d < 160 && big.dive <= 0) { // 고래 곁으로 몰려듦
        const tx = big.x - big.dir * 10, ty = big.y + (s.y < big.y ? -20 : 20);
        s.wa = angLerp(s.wa, Math.atan2(ty - s.y, tx - s.x), dt * 1.4);
      } else if ((big.type === 'shark' && d < 60) || (big.type === 'squid' && d < 45)) {
        s.wa = angLerp(s.wa, Math.atan2(s.y - big.y, s.x - big.x), dt * 4); s.scared = Math.max(s.scared, 1.2);
      }
    }
    const sp = s.sp.speed * s.mult * (s.scared > 0 ? 2.3 : 1);
    s.vx = lerp(s.vx, Math.cos(s.wa) * sp, dt * 2); s.vy = lerp(s.vy, Math.sin(s.wa) * sp, dt * 2);
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.dT -= dt;
    if (s.dT <= 0) { s.td = rand(...s.sp.depth); s.dT = rand(3, 7); }
    s.depth = lerp(s.depth, s.td, dt * 0.4);
  }
  schools = schools.filter(s => !s.dead);
}

function updateFish(dt) {
  let ci = 0;
  for (const f of fish) {
    if (f.state === 'swim') {
      const s = f.school;
      if (f.panic > 0) {
        f.panic -= dt; f.vx *= 1 - dt * 1.4; f.vy *= 1 - dt * 1.4;
      } else {
        const tx = s.x + f.ox + Math.sin(time * 0.9 + f.ph) * 3, ty = s.y + f.oy + Math.cos(time * 0.7 + f.ph) * 2;
        let ax = (tx - f.x) * 1.8 + (s.vx - f.vx) * 1.3, ay = (ty - f.y) * 1.8 + (s.vy - f.vy) * 1.3;
        for (const o of s.fish) {
          if (o === f) continue;
          const dx = f.x - o.x, dy = f.y - o.y, d2 = dx * dx + dy * dy;
          if (d2 < 30 && d2 > 0.01) { ax += dx / d2 * 40; ay += dy / d2 * 40; }
        }
        f.vx += ax * dt; f.vy += ay * dt;
        const mx = s.sp.speed * s.mult * 2.8, v = Math.hypot(f.vx, f.vy);
        if (v > mx) { f.vx *= mx / v; f.vy *= mx / v; }
      }
      f.x += f.vx * dt; f.y += f.vy * dt;
      if (f.y > SHORE - 6) { f.y = SHORE - 6; f.vy = -Math.abs(f.vy); }
      f.depth = lerp(f.depth, clamp(s.depth + f.dz, 0.04, 1), dt * 0.8);
      const v = Math.hypot(f.vx, f.vy);
      if (v > 2) f.ang = angLerp(f.ang, Math.atan2(f.vy, f.vx), dt * 7);
      f.ph += dt * (5 + v * 0.25);
    } else if (f.state === 'rise') {
      f.depth -= dt * 0.9; f.vx *= 0.9; f.vy *= 0.9; f.ang += dt * 3;
      if (f.depth <= 0) { f.depth = 0; f.state = 'float'; f.ft = 0; ripples.push({ x: f.x, y: f.y, r: 1, max: 6, life: 0.6 }); }
    } else if (f.state === 'float') {
      f.ft += dt;
      if (f.ft > 0.9) {
        f.state = 'got';
        const pts = Math.round(f.sp.pts * (f.ex ? f.ex.mult : 1));
        addScore(pts); stats.fish++; stats.kinds[f.kind]++;
        texts.push(mkText(f.x, f.y - 3, '+' + pts, f.sp.pts >= 80 ? '#ffe066' : f.sp.pts >= 30 ? '#ffc58f' : '#e8f4f8', f.sp.pts >= 80 ? 1.1 : 0.85));
        sfx.collect(ci++);
      }
    }
  }
  fish = fish.filter(f => f.state !== 'got' && f.state !== 'eaten' && f.state !== 'gone');
}

function updateAmbient(dt) {
  for (const p of parts) {
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.type === 'drop') { p.vz -= 160 * dt; p.z += p.vz * dt; if (p.z < 0) { p.life = 0; if (Math.random() < 0.15) ripples.push({ x: p.x, y: p.y, r: 0, max: 3, life: 0.4 }); } }
    else if (p.type === 'fire') { p.z += p.vz * dt; p.vx *= 0.92; p.vy *= 0.92; }
    else if (p.type === 'spark') { p.vz -= 90 * dt; p.z += p.vz * dt; p.vx *= 0.96; p.vy *= 0.96; if (p.z < -2) p.life = 0; }
    else if (p.type === 'wisp') { p.z += 10 * dt; p.vx *= 0.97; }
    else if (p.type === 'gib') {
      p.vz -= 260 * dt; p.z += p.vz * dt; p.rot += p.spin * dt;
      if (p.z < 0) {
        if (p.y < SHORE) { // 물에 빠짐
          p.life = 0; ripples.push({ x: p.x, y: p.y, r: 0, max: 5, life: 0.7 });
          for (let i = 0; i < 3; i++) parts.push({ x: p.x, y: p.y, z: 0, vx: rand(-8, 8), vy: rand(-5, 5), vz: rand(15, 30), life: 0.4, max: 0.4, type: 'drop' });
        } else { p.z = 0; p.vz = Math.abs(p.vz) > 20 ? -p.vz * 0.35 : 0; p.vx *= 0.55; p.vy *= 0.55; p.spin *= 0.5; if (!p.vz) { p.vx *= 0.8; p.vy *= 0.8; } }
      }
    }
    else if (p.type === 'smoke') { p.z += 12 * dt; p.vx *= 0.95; p.vy *= 0.95; }
  }
  parts = parts.filter(p => p.life > 0);
  for (const r of ripples) { r.life -= dt; r.r = lerp(r.r, r.max, dt * 2.5); }
  ripples = ripples.filter(r => r.life > 0);
  for (const bl of blasts) bl.t += dt;
  blasts = blasts.filter(bl => bl.t < 1.2);
  for (const t of texts) t.t += dt;
  texts = texts.filter(t => t.t < t.life);
  shake = Math.max(0, shake - dt * 18);
  flash = Math.max(0, flash - dt * 2.5);
  ink = Math.max(0, ink - dt * 0.12);
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  // 물고기 위 거품 (얕은 떼 힌트)
  if (state === 'play') for (const s of schools) if (s.depth < 0.35 && Math.random() < dt * 0.8) ripples.push({ x: s.x + rand(-6, 6), y: s.y + rand(-4, 4), r: 0, max: 4, life: 0.7 });
}

// ===== 그리기 =====
function fishShape(L, x, y, ang, len, wid, ph, col) {
  L.save(); L.translate(x, y); L.rotate(ang); L.fillStyle = col;
  L.beginPath(); L.ellipse(0, 0, len / 2, wid / 2, 0, 0, TAU); L.fill();
  const w = Math.sin(ph) * wid * 0.5;
  L.beginPath(); L.moveTo(-len / 2 + 1, 0); L.lineTo(-len / 2 - len * 0.32, -wid * 0.6 + w); L.lineTo(-len / 2 - len * 0.32, wid * 0.6 + w); L.closePath(); L.fill();
  L.restore();
}

function drawShadows() {
  dctx.clearRect(0, 0, VW, VH); sctx.clearRect(0, 0, VW, VH);
  for (const f of fish) {
    if (f.state === 'float') continue;
    const L = f.depth > 0.5 ? dctx : sctx;
    const sc = 1 - f.depth * 0.32;
    L.globalAlpha = clamp(0.62 - f.depth * 0.42, 0.12, 0.7);
    fishShape(L, f.x, f.y, f.ang, f.sp.len * sc, f.sp.wid * sc, f.ph, f.state === 'rise' ? '#0c3340' : SHADOW);
  }
  if (big) drawBigShadow();
  dctx.globalAlpha = sctx.globalAlpha = 1;
}

function drawBigShadow() {
  const B = big;
  if ((B.type === 'shark' && B.dead && B.depth <= 0) || (B.type === 'squid' && B.dead && B.depth <= 0)) return;
  const L = B.depth > 0.45 ? dctx : sctx;
  L.globalAlpha = clamp(0.6 - B.depth * 0.4, 0.12, 0.65) * (B.type === 'squid' && B.t > B.life ? clamp(1.3 - B.depth, 0, 1) : 1);
  L.fillStyle = SHADOW;
  const sc = 1 - B.depth * 0.25;
  if (B.type === 'shark') {
    L.save(); L.translate(B.x, B.y); L.rotate(B.ang); L.scale(sc, sc);
    const w = Math.sin(B.t * 6) * 2.5, len = B.len, wid = B.wid;
    L.beginPath(); L.moveTo(len / 2 + 2, 0);
    L.quadraticCurveTo(len / 4, -wid / 2 - 1, -len / 4, -wid / 3);
    L.lineTo(-len / 2, w * 0.4); L.lineTo(-len / 4, wid / 3);
    L.quadraticCurveTo(len / 4, wid / 2 + 1, len / 2 + 2, 0); L.fill();
    L.beginPath(); L.moveTo(-len / 2 + 1, w * 0.4); L.lineTo(-len / 2 - 7, -6 + w); L.lineTo(-len / 2 - 4, w * 0.5); L.lineTo(-len / 2 - 7, 5 + w); L.fill();
    L.beginPath(); L.moveTo(len / 8, 0); L.lineTo(-len / 12, -wid - 3); L.lineTo(-len / 8, 0); L.lineTo(-len / 12, wid + 3); L.fill();
    L.restore();
  } else if (B.type === 'whale') {
    L.save(); L.translate(B.x, B.y); L.scale(B.dir * sc, sc);
    const w = Math.sin(B.t * 1.5) * 3;
    L.beginPath(); L.ellipse(4, 0, B.len / 2, B.wid / 2, 0, 0, TAU); L.fill();
    L.beginPath(); L.moveTo(-B.len / 2 + 4, 0); L.lineTo(-B.len / 2 - 6, w * 0.5);
    L.lineTo(-B.len / 2 - 14, -10 + w); L.lineTo(-B.len / 2 - 9, w); L.lineTo(-B.len / 2 - 14, 10 + w); L.closePath(); L.fill();
    L.beginPath(); L.ellipse(6, -B.wid / 2 - 3, 9, 3, -0.5, 0, TAU); L.fill();
    L.beginPath(); L.ellipse(6, B.wid / 2 + 3, 9, 3, 0.5, 0, TAU); L.fill();
    L.restore();
  } else {
    // 대왕오징어: 몸통 + 촉수
    L.save(); L.translate(B.x, B.y);
    L.beginPath(); L.ellipse(0, -6 * sc, 9 * sc, 15 * sc, 0, 0, TAU); L.fill();
    L.restore();
    for (const t of B.tents) {
      const p = tentTip(t);
      const LL = p.depth > 0.45 ? dctx : sctx;
      LL.globalAlpha = clamp(0.6 - p.depth * 0.4, 0.12, 0.65);
      LL.strokeStyle = SHADOW; LL.lineCap = 'round';
      const segs = 7;
      for (let i = 0; i < segs; i++) {
        const u0 = i / segs, u1 = (i + 1) / segs;
        const wob = k => Math.sin(B.t * 3 + t.a * 5 + k * 5) * 3 * k;
        const nx = -Math.sin(p.a), ny = Math.cos(p.a);
        LL.lineWidth = lerp(4, 1.2, u0);
        LL.beginPath();
        LL.moveTo(lerp(B.x, p.x, u0) + nx * wob(u0), lerp(B.y, p.y, u0) + ny * wob(u0));
        LL.lineTo(lerp(B.x, p.x, u1) + nx * wob(u1), lerp(B.y, p.y, u1) + ny * wob(u1));
        LL.stroke();
      }
    }
  }
}

function drawSurfaceThings() {
  // 수면 위로 드러난 것들 (떠오른 물고기, 상어 지느러미, 촉수 끝)
  for (const f of fish) {
    if (f.state !== 'float') continue;
    const bob = Math.sin(time * 6 + f.ph) * 0.5;
    b.save(); b.translate(f.x, f.y + bob); b.rotate(f.ang);
    const l = f.sp.len, w = f.sp.wid;
    b.fillStyle = f.kind === 'catfish' ? '#c9c2a8' : f.kind === 'carp' ? '#f0d9b5' : '#e8ecef';
    b.beginPath(); b.ellipse(0, 0, l / 2, w / 2, 0, 0, TAU); b.fill();
    b.beginPath(); b.moveTo(-l / 2 + 1, 0); b.lineTo(-l / 2 - l * 0.3, -w * 0.6); b.lineTo(-l / 2 - l * 0.3, w * 0.6); b.fill();
    b.fillStyle = '#333'; b.fillRect(Math.round(l / 2 - 2), -1, 1, 1);
    b.restore();
  }
  if (!big) return;
  if (big.type === 'shark' && !big.dead && big.depth < 0.16) {
    // 등지느러미
    const fx = big.x + Math.cos(big.ang) * 1, fy = big.y + Math.sin(big.ang) * 1;
    b.fillStyle = '#5d6d75';
    b.beginPath(); b.moveTo(fx - Math.cos(big.ang) * 4, fy - 1); b.lineTo(fx + Math.cos(big.ang) * 2, fy - 7); b.lineTo(fx + Math.cos(big.ang) * 4, fy); b.fill();
    b.fillStyle = 'rgba(255,255,255,0.6)'; b.fillRect(Math.round(fx - 4), Math.round(fy), 8, 1);
  }
  if ((big.type === 'shark' || big.type === 'squid') && big.dead && big.depth <= 0) {
    b.save(); b.translate(big.x, big.y);
    if (big.type === 'shark') {
      b.rotate(big.ang); b.fillStyle = '#d9dee2';
      b.beginPath(); b.ellipse(0, 0, big.len / 2, big.wid / 2, 0, 0, TAU); b.fill();
      b.beginPath(); b.moveTo(-big.len / 2, 0); b.lineTo(-big.len / 2 - 6, -5); b.lineTo(-big.len / 2 - 6, 5); b.fill();
    } else {
      b.fillStyle = '#c86a8a'; b.beginPath(); b.ellipse(0, -6, 9, 15, 0, 0, TAU); b.fill();
      b.fillStyle = '#fff'; b.fillRect(-4, 2, 2, 2); b.fillRect(2, 2, 2, 2);
    }
    b.restore();
  }
  if (big.type === 'squid' && !big.dead) {
    for (const t of big.tents) {
      if (t.rise < 0.75) continue;
      const p = tentTip(t);
      const k = (t.rise - 0.75) / 0.25;
      b.strokeStyle = `rgba(200,100,140,${0.9 * k})`; b.lineWidth = 2; b.lineCap = 'round';
      b.beginPath();
      const nx = -Math.sin(p.a), ny = Math.cos(p.a);
      for (let i = 0; i <= 5; i++) {
        const u = 0.55 + i * 0.09;
        const wv = Math.sin(time * 5 + i + t.a * 3) * 2.5 * u;
        const x = lerp(big.x, p.x, u) + nx * wv, y = lerp(big.y, p.y, u) + ny * wv - i * 1.2 * k;
        i ? b.lineTo(x, y) : b.moveTo(x, y);
      }
      b.stroke();
    }
  }
}

function drawPier() {
  b.fillStyle = 'rgba(255,255,255,0.35)';
  for (let x = 0; x < VW; x += 3) b.fillRect(x, SHORE - 1 + Math.round(Math.sin(time * 2 + x * 0.3)), 2, 1);
  b.fillStyle = '#6b4a2b'; b.fillRect(0, SHORE + 2, VW, VH - SHORE);
  for (let y = SHORE + 2; y < VH; y += 6) { b.fillStyle = '#7d5935'; b.fillRect(0, y, VW, 4); b.fillStyle = '#4a311c'; b.fillRect(0, y + 5, VW, 1); }
  b.fillStyle = '#3b2615'; for (let x = 6; x < VW; x += 34) b.fillRect(x, SHORE + 2, 2, VH - SHORE);
}

function drawPlayer() {
  const px = Math.round(player.x), py = Math.round(player.y);
  if (player.dead) { // 그을린 자국만 남는다
    b.fillStyle = 'rgba(20,10,5,0.75)'; b.beginPath(); b.ellipse(px, py + 6, 9, 3, 0, 0, TAU); b.fill();
    b.fillStyle = 'rgba(40,20,10,0.5)'; b.beginPath(); b.ellipse(px + 3, py + 7, 13, 4, 0, 0, TAU); b.fill();
    return;
  }
  const burnt = player.stun > 0;
  const skin = burnt ? '#2b2b2b' : '#f1c27d', shirt = burnt ? '#222' : '#d9483b', pants = burnt ? '#1a1a1a' : '#2f4a7a';
  // 그림자
  b.fillStyle = 'rgba(0,0,0,0.3)'; b.fillRect(px - 4, py + 7, 9, 2);
  b.fillStyle = pants; b.fillRect(px - 3, py + 2, 2, 6); b.fillRect(px + 1, py + 2, 2, 6);
  b.fillStyle = shirt; b.fillRect(px - 4, py - 5, 8, 7);
  b.fillStyle = skin; b.fillRect(px - 3, py - 11, 6, 6);
  b.fillStyle = burnt ? '#111' : '#e0b04a'; b.fillRect(px - 4, py - 12, 8, 2); b.fillRect(px - 2, py - 14, 4, 2); // 밀짚모자
  if (burnt) { b.fillStyle = '#fff'; b.fillRect(px - 2, py - 9, 1, 1); b.fillRect(px + 1, py - 9, 1, 1); }
  // 팔
  let ang = -Math.PI / 2, ext = 4;
  if (hold) { const a = aimInfo(hold); ang = a.len > 4 ? a.ang + Math.PI : Math.PI / 2 + 0.6; ext = 4 + a.p * 3; }
  else if (player.throwAnim > 0) { ang = player.lastAng ?? -Math.PI / 2; ext = 7; }
  const ax = px + Math.cos(ang) * ext, ay = py - 4 + Math.sin(ang) * ext;
  b.strokeStyle = skin; b.lineWidth = 2;
  b.beginPath(); b.moveTo(px + (Math.cos(ang) > 0 ? 3 : -3), py - 4); b.lineTo(ax, ay); b.stroke();
  if (hold) {
    b.fillStyle = '#c0392b'; b.fillRect(Math.round(ax) - 1, Math.round(ay) - 3, 3, 5);
    const fl = hold.fuse / FUSE;
    const tx = Math.round(ax) + 1, ty = Math.round(ay) - 3 - Math.round(fl * 3) - 1;
    b.fillStyle = '#9b7442'; b.fillRect(tx, ty + 1, 1, Math.round(fl * 3) + 1);
    b.save(); b.globalCompositeOperation = 'lighter';
    const gl = b.createRadialGradient(tx, ty, 0, tx, ty, 6 * fuseFx.flick);
    gl.addColorStop(0, 'rgba(255,220,140,0.6)'); gl.addColorStop(1, 'rgba(255,120,20,0)');
    b.fillStyle = gl; b.beginPath(); b.arc(tx, ty, 6, 0, TAU); b.fill();
    b.restore();
    b.fillStyle = '#fffbe0'; b.fillRect(tx, ty, 1, 1);
    for (let i = 0; i < 2; i++) if (Math.random() < 0.7) { const a = rand(0, TAU), sp = rand(10, 30); parts.push({ x: tx, y: ty + 4, z: 4, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6, vz: rand(0, 30), life: rand(0.12, 0.3), max: 0.3, type: 'spark' }); }
    if (Math.random() < 0.25) parts.push({ x: tx, y: ty + 4, z: 4, vx: rand(-2, 2), vy: 0, vz: 0, life: 0.7, max: 0.7, type: 'wisp' });
  }
  if (burnt && Math.random() < 0.3) parts.push({ x: px + rand(-3, 3), y: py - 12, z: 0, vx: rand(-3, 3), vy: -6, vz: 0, life: 0.8, max: 0.8, type: 'smoke' });
}

function drawAimGuide() {
  if (!hold) return;
  const a = aimInfo(hold);
  if (a.len < 4) return;
  const arc = 14 + a.fd * 0.22;
  b.fillStyle = 'rgba(255,255,255,0.8)';
  for (let t = 0.06; t < 1; t += 0.07) {
    const x = lerp(a.hx, a.lx, t), y = lerp(a.hy, a.ly, t) - arc * 4 * t * (1 - t);
    b.fillRect(Math.round(x), Math.round(y), 1, 1);
  }
  const zc = ZONES[zoneOf(a.pdepth)].col;
  b.strokeStyle = zc; b.lineWidth = 1;
  b.globalAlpha = 0.5 + Math.sin(time * 10) * 0.2;
  b.beginPath(); b.ellipse(a.lx, a.ly, R, R * 0.8, 0, 0, TAU); b.stroke();
  b.globalAlpha = 1;
  b.fillStyle = zc; b.fillRect(Math.round(a.lx) - 1, Math.round(a.ly), 3, 1); b.fillRect(Math.round(a.lx), Math.round(a.ly) - 1, 1, 3);
}

function drawBombs(under) {
  for (const bm of bombs) {
    if (under && bm.state === 'water') {
      const al = 1 - bm.depth * 0.75, sc = 1 - bm.depth * 0.3;
      b.globalAlpha = al;
      b.fillStyle = '#7a1f17'; b.fillRect(Math.round(bm.x - 1), Math.round(bm.y - 2 * sc), 3, Math.max(2, Math.round(4 * sc)));
      const blink = (time * (4 + 16 / (bm.fuse + 0.3)) | 0) % 2;
      if (blink) { b.fillStyle = 'rgba(255,170,60,0.6)'; b.beginPath(); b.arc(bm.x, bm.y - 2, 2.5 * sc, 0, TAU); b.fill(); }
      if (bm.fuse < 0.3) { // 폭발 직전 예고 섬광
        const k = 1 - bm.fuse / 0.3;
        b.fillStyle = `rgba(255,245,200,${0.25 + k * 0.5})`; b.beginPath(); b.arc(bm.x, bm.y, 3 + k * 10, 0, TAU); b.fill();
      }
      b.globalAlpha = 1;
    } else if (!under && bm.state === 'air') {
      b.fillStyle = 'rgba(0,0,0,0.25)'; b.fillRect(Math.round(bm.x - 2), Math.round(bm.y), 4, 1);
      b.save(); b.translate(Math.round(bm.x), Math.round(bm.y - bm.z)); b.rotate(bm.spin);
      b.fillStyle = '#d0362a'; b.fillRect(-1, -3, 3, 6);
      b.fillStyle = '#ffe066'; b.fillRect(0, -5, 1, 2);
      b.restore();
    }
  }
}

function drawBlasts() {
  for (const bl of blasts) {
    const surf = 1 - clamp(Math.max(0, bl.depth), 0, 1), t = bl.t;
    if (t < 0.12) { // 물속 섬광
      b.fillStyle = `rgba(255,250,220,${(0.5 + surf * 0.5) * (1 - t / 0.12)})`;
      b.beginPath(); b.arc(bl.x, bl.y, 6 + t * 120, 0, TAU); b.fill();
    }
    const r = R * (0.3 + t * 1.6);
    b.fillStyle = `rgba(210,245,245,${Math.max(0, 0.55 * surf + 0.15) * (1 - t / 1.2)})`;
    b.beginPath(); b.ellipse(bl.x, bl.y, r, r * 0.8, 0, 0, TAU); b.fill();
    if (bl.depth < 0.1 && t < 0.4) { // 수면/공중 폭발 불덩이
      const k = 1 - t / 0.4;
      b.fillStyle = `rgba(255,140,40,${k})`; b.beginPath(); b.arc(bl.x, bl.y - 6, 10 * (0.6 + t * 2), 0, TAU); b.fill();
      b.fillStyle = `rgba(255,240,150,${k})`; b.beginPath(); b.arc(bl.x, bl.y - 6, 5 * (0.6 + t * 2), 0, TAU); b.fill();
    }
    if (t < 0.7) { // 물기둥
      const h = (6 + surf * 34) * Math.sin(Math.min(1, t / 0.7) * Math.PI);
      b.fillStyle = `rgba(235,250,255,${0.7 * (1 - t / 0.7)})`;
      b.fillRect(Math.round(bl.x - 3 - surf * 3), Math.round(bl.y - h), Math.round(6 + surf * 6), Math.round(h));
    }
  }
}

function drawParts() {
  for (const p of parts) {
    const k = p.life / p.max;
    const x = Math.round(p.x), y = Math.round(p.y - p.z);
    if (p.type === 'drop') { b.fillStyle = `rgba(225,248,255,${0.5 + k * 0.5})`; b.fillRect(x, y, 1, p.vz > 0 ? 2 : 1); }
    else if (p.type === 'bubble') { b.fillStyle = `rgba(220,250,255,${k * 0.6})`; b.fillRect(x, y, 1, 1); }
    else if (p.type === 'fire') { b.fillStyle = k > 0.5 ? '#ffe066' : '#ff7b2a'; b.fillRect(x, y, 2, 2); }
    else if (p.type === 'spark') { b.fillStyle = k > 0.65 ? '#fffbe0' : k > 0.35 ? '#ffd45a' : '#ff7a24'; b.fillRect(x, y, 1, 1); }
    else if (p.type === 'wisp') { b.fillStyle = `rgba(210,210,205,${k * 0.35})`; b.fillRect(x, y, 2, 1); }
    else if (p.type === 'gib') {
      if (p.z > 0) { b.fillStyle = 'rgba(0,0,0,0.25)'; b.fillRect(Math.round(p.x) - 1, Math.round(p.y), p.w, 1); }
      b.save(); b.globalAlpha = Math.min(1, p.life / 0.5); b.translate(x, y); b.rotate(Math.round(p.rot / (Math.PI / 4)) * Math.PI / 4);
      b.fillStyle = p.col; b.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); b.restore();
    }
    else if (p.type === 'smoke') { b.fillStyle = `rgba(60,60,60,${k * 0.6})`; b.fillRect(x - 1, y - 1, 3, 3); }
  }
}

function render() {
  // 물
  const g = b.createLinearGradient(0, 0, 0, SHORE);
  g.addColorStop(0, '#1c5865'); g.addColorStop(1, '#2d7a77');
  b.fillStyle = g; b.fillRect(0, 0, VW, VH);

  drawShadows();
  b.save();
  b.filter = 'blur(1.2px)'; b.drawImage(deepC, 0, 0);
  b.filter = 'blur(0.4px)'; b.drawImage(shC, 0, 0);
  b.restore();
  drawBombs(true);

  // 수면 반짝임
  if (!causticPat) causticPat = b.createPattern(caustic, 'repeat');
  b.save(); b.fillStyle = causticPat;
  b.globalAlpha = 0.07; b.translate((time * 6) % 64, (time * 2.5) % 64); b.fillRect(-64, -64, VW + 128, SHORE + 128);
  b.restore();
  b.save(); b.fillStyle = causticPat;
  b.globalAlpha = 0.05; b.translate(-(time * 4) % 64, (time * 5) % 64); b.scale(1.5, 1.5); b.fillRect(-64, -64, VW, SHORE);
  b.restore();
  b.fillStyle = 'rgba(40,110,115,0.12)'; b.fillRect(0, 0, VW, SHORE);

  for (const r of ripples) {
    b.strokeStyle = `rgba(230,250,255,${clamp(r.life, 0, 1) * 0.5})`; b.lineWidth = 1;
    b.beginPath(); b.ellipse(r.x, r.y, Math.max(0.5, r.r), Math.max(0.5, r.r * 0.75), 0, 0, TAU); b.stroke();
  }
  drawSurfaceThings();
  drawSwimmer();
  drawBlasts();
  drawPier();
  if (state === 'play' || state === 'end' || state === 'clear') drawPlayer();
  drawAimGuide();
  drawBombs(false);
  drawParts();

  if (ink > 0) { b.fillStyle = `rgba(12,6,24,${Math.min(0.75, ink * 0.8)})`; b.fillRect(0, 0, VW, SHORE); }
  if (flash > 0) { b.fillStyle = `rgba(255,255,240,${flash * 0.5})`; b.fillRect(0, 0, VW, VH); }

  // 화면으로 확대
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#0b1d26'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  const sx = shake ? Math.round(rand(-shake, shake)) * S / 2 : 0, sy = shake ? Math.round(rand(-shake, shake)) * S / 2 : 0;
  ctx.drawImage(buf, sx, sy, VW * S, VH * S);
  if (state !== 'menu') drawHUD();
}

function txt(str, x, y, size, col, align = 'left', stroke = true) {
  ctx.font = `800 ${size}px system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y); }
  ctx.fillStyle = col; ctx.fillText(str, x, y);
}

// ===== 도화선 불꽃 이펙트 (화면 좌표) =====
const fuseFx = { sparks: [], smoke: [], on: false, lightX: 0, lightY: 0, k: 1, flick: 1 };
let frameDt = 1 / 60;
function emitFuseFx(x, y, k, intensity) {
  const dt = frameDt;
  // 사방으로 튀는 불티
  let n = 150 * intensity * dt;
  while (n > 0) {
    if (Math.random() < n) {
      const a = rand(0, TAU), sp = rand(60, 230) * k * (Math.random() < 0.15 ? 1.6 : 1);
      fuseFx.sparks.push({ x, y, px: x, py: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40 * k, life: rand(0.1, 0.38), max: 0.38, w: rand(0.8, 1.8) * k });
    }
    n -= 1;
  }
  // 가끔 터지듯 한 움큼
  if (Math.random() < dt * 4 * intensity) {
    for (let i = 0; i < 10; i++) {
      const a = rand(-Math.PI, 0), sp = rand(150, 320) * k;
      fuseFx.sparks.push({ x, y, px: x, py: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.2, 0.45), max: 0.45, w: rand(1, 2) * k });
    }
    if (ac && !muted) noiseBurst(0.03, 6500, 0.12, 'highpass');
  }
  // 연기
  if (Math.random() < dt * 22) fuseFx.smoke.push({ x: x + rand(-2, 2) * k, y: y - 4 * k, vx: rand(-8, 8) * k, vy: rand(-45, -25) * k, r: rand(2, 4) * k, life: rand(0.7, 1.2), max: 1.2 });
}
function updateFuseFx(dt) {
  const g = 520 * fuseFx.k;
  for (const p of fuseFx.sparks) { p.px = p.x; p.py = p.y; p.vy += g * dt; p.vx *= 1 - dt * 1.5; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  fuseFx.sparks = fuseFx.sparks.filter(p => p.life > 0);
  for (const s2 of fuseFx.smoke) { s2.x += s2.vx * dt + Math.sin(time * 3 + s2.r) * 6 * fuseFx.k * dt; s2.y += s2.vy * dt; s2.vy *= 1 - dt * 0.8; s2.r += 9 * fuseFx.k * dt; s2.life -= dt; }
  fuseFx.smoke = fuseFx.smoke.filter(s2 => s2.life > 0);
  // 불빛 깜빡임: 부드러운 노이즈
  fuseFx.flick = lerp(fuseFx.flick, rand(0.7, 1.25), dt * 25);
  if (!hold) fuseFx.on = false;
}
function drawFuseFx() {
  const k = fuseFx.k;
  // 연기 (일반 합성)
  for (const s2 of fuseFx.smoke) {
    const t = s2.life / s2.max;
    ctx.fillStyle = `rgba(190,190,185,${0.28 * t})`;
    ctx.beginPath(); ctx.arc(s2.x, s2.y, s2.r, 0, TAU); ctx.fill();
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  if (fuseFx.on) {
    const x = fuseFx.lightX, y = fuseFx.lightY, f = fuseFx.flick;
    // 넓은 주변광
    let gr = ctx.createRadialGradient(x, y, 0, x, y, 48 * k * f);
    gr.addColorStop(0, 'rgba(255,170,70,0.35)'); gr.addColorStop(1, 'rgba(255,90,0,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, 48 * k * f, 0, TAU); ctx.fill();
    // 뜨거운 중심
    gr = ctx.createRadialGradient(x, y, 0, x, y, 9 * k * f);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,240,170,0.9)'); gr.addColorStop(1, 'rgba(255,150,40,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, 9 * k * f, 0, TAU); ctx.fill();
  }
  // 불티: 꼬리를 끄는 선, 식으면서 흰색→노랑→주황→빨강
  ctx.lineCap = 'round';
  for (const p of fuseFx.sparks) {
    const t = p.life / p.max;
    const col = t > 0.7 ? '255,250,225' : t > 0.45 ? '255,215,110' : t > 0.2 ? '255,140,40' : '220,60,20';
    ctx.strokeStyle = `rgba(${col},${Math.min(1, t * 1.6)})`; ctx.lineWidth = p.w;
    ctx.beginPath(); ctx.moveTo(p.px - (p.x - p.px) * 1.5, p.py - (p.y - p.py) * 1.5); ctx.lineTo(p.x, p.y); ctx.stroke();
  }
  ctx.restore();
}

function drawFuseStick(u) {
  const a = aimInfo(hold), W = cvs.width, H = cvs.height;
  const fs = Math.max(12, u * 1.05);
  // 손가락 옆 큼직한 다이너마이트 + 구간별로 칠한 도화선
  const k = clamp(Math.min(W, H) / 480, 0.95, 1.35);
  const FL = 150 * k, sw = 20 * k, sh = 44 * k;
  const fx = hold.cx * S, fy = hold.cy * S;
  let ix = fx + (fx > W * 0.4 ? -80 * k : 80 * k);
  let iy = clamp(fy - 40 * k, FL + sh / 2 + 40 * k, H - sh / 2 - 10);
  if (a.zone === 0) { ix += rand(-2, 2) * k; iy += rand(-2, 2) * k; }
  if (hold.zonePop > 0) { const p = hold.zonePop / 0.25; ix += Math.sin(p * 20) * 3 * k; }
  const top = iy - sh / 2;                       // 도화선이 시작되는 막대 꼭대기
  const yAt = r => top - FL * clamp(r / FUSE, 0, 1); // 남은 시간 r초 위치
  const fl = a.flightEff;
  const bounds = [0, fl, fl + 0.4 / SINK, fl + 0.7 / SINK, FUSE].map(v => Math.min(FUSE, v));
  const sy = yAt(hold.fuse);
  // 구간 눈금자 (도화선 오른쪽의 얇은 색 띠)
  const rx = ix + 9 * k;
  ctx.lineCap = 'butt';
  for (let zi = 0; zi < 4; zi++) {
    const r0 = bounds[zi], r1 = Math.min(bounds[zi + 1], hold.fuse);
    if (r1 <= r0) continue;
    ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 5 * k;
    ctx.beginPath(); ctx.moveTo(rx, yAt(r0)); ctx.lineTo(rx, yAt(r1)); ctx.stroke();
    ctx.strokeStyle = ZONES[zi].col; ctx.lineWidth = 3 * k;
    ctx.beginPath(); ctx.moveTo(rx, yAt(r0) - 1); ctx.lineTo(rx, yAt(r1) + 1); ctx.stroke();
    const ym = (yAt(r0) + yAt(Math.min(bounds[zi + 1], FUSE))) / 2;
    if (yAt(r0) - yAt(bounds[zi + 1]) > 14 * k && zi !== a.zone && ym > sy + 8 * k) {
      ctx.globalAlpha = 0.8; txt(ZONES[zi].name, rx + 6 * k, ym, fs * 0.85, ZONES[zi].col); ctx.globalAlpha = 1;
    }
  }
  for (let zi = 1; zi < 4; zi++) if (bounds[zi] < hold.fuse) { ctx.fillStyle = '#000'; ctx.fillRect(rx - 4 * k, yAt(bounds[zi]) - 1, 8 * k, 2 * k); }
  // 꼬인 심지 (살짝 휘어짐)
  const bend = y => Math.sin((top - y) / (FL) * 2.2 + 0.6) * 3 * k;
  const cordW = 4.5 * k;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#2a1a0c'; ctx.lineWidth = cordW + 3 * k;
  ctx.beginPath(); for (let y = top; y >= sy; y -= 3) { const x = ix + bend(y); y === top ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.lineTo(ix + bend(sy), sy); ctx.stroke();
  ctx.strokeStyle = '#9b7442'; ctx.lineWidth = cordW;
  ctx.beginPath(); for (let y = top; y >= sy; y -= 3) { const x = ix + bend(y); y === top ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.lineTo(ix + bend(sy), sy); ctx.stroke();
  ctx.strokeStyle = '#5e4322'; ctx.lineWidth = 1.2 * k; ctx.lineCap = 'butt';
  for (let y = top - 2 * k; y > sy + 4 * k; y -= 4 * k) {
    const x = ix + bend(y);
    ctx.beginPath(); ctx.moveTo(x - cordW / 2, y + 1.5 * k); ctx.lineTo(x + cordW / 2, y - 1.5 * k); ctx.stroke();
  }
  // 타 들어가는 부분: 검게 그을린 끝 + 붉은 불씨
  const ex = ix + bend(sy);
  const eg = ctx.createLinearGradient(0, sy, 0, sy + 9 * k);
  eg.addColorStop(0, '#ffef9a'); eg.addColorStop(0.25, '#ff7a1a'); eg.addColorStop(0.6, '#7a1e08'); eg.addColorStop(1, 'rgba(30,15,5,0)');
  ctx.fillStyle = eg; ctx.fillRect(ex - cordW / 2 - 0.5, sy, cordW + 1, 9 * k);
  // 막대
  ctx.fillStyle = '#000'; ctx.fillRect(ix - sw / 2 - 2, top - 2, sw + 4, sh + 4);
  ctx.fillStyle = '#d0362a'; ctx.fillRect(ix - sw / 2, top, sw, sh);
  ctx.fillStyle = '#f4ead2'; ctx.fillRect(ix - sw / 2, top + sh * 0.38, sw, sh * 0.22);
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(ix - sw / 2 + 2 * k, top + 2 * k, 3 * k, sh - 4 * k);
  // 불꽃: 파티클 생성 (그리기는 drawFuseFx)
  const zc = ZONES[a.zone].col;
  emitFuseFx(ex, sy, k, a.zone === 0 ? 1.6 : 1);
  fuseFx.lightX = ex; fuseFx.lightY = sy; fuseFx.k = k; fuseFx.on = true;
  drawFuseFx();
  // 현재 구간 큰 글씨
  const pop = hold.zonePop > 0 ? 1 + hold.zonePop * 1.6 : 1;
  txt(ZONES[a.zone].name, ix - 14 * k, sy - 4 * k, fs * 1.5 * pop, zc, 'right');
  // 위험 구간: 화면 가장자리 붉은 맥박
  if (a.zone === 0) {
    const al = 0.25 + Math.sin(time * 18) * 0.15;
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(255,0,0,0)'); vg.addColorStop(1, `rgba(255,30,10,${al})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
}

function drawHUD() {
  const u = S * 3.2, W = cvs.width;
  txt(`${day}일차`, 12, 18, u * 1.2, '#ffcf5b');
  txt(`총점 ${score}`, 12, 18 + u * 1.9, u * 1.9, '#fff');
  // 오늘 목표 진행 막대
  const bw = Math.min(W * 0.42, 240), bh = Math.max(8, u * 0.9), bx = 12, by = 18 + u * 3.3;
  const pr = clamp(dayScore / target, 0, 1), ok = dayScore >= target;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
  ctx.fillStyle = ok ? '#5fe08a' : '#f2c14e'; ctx.fillRect(bx, by, bw * pr, bh);
  txt(ok ? `목표 달성! ${dayScore} / ${target}` : `오늘 ${dayScore} / ${target}`, bx, by + bh + u * 0.9, u * 1.05, ok ? '#8ff0ad' : '#dde');
  if (ok && dayScore - target >= 100) txt(`내일 보너스 +${Math.min(3, Math.floor((dayScore - target) / 100))}`, bx, by + bh + u * 2.1, u * 1.0, '#ffb347');
  if (streak >= 1) txt(`🔥 연속 ${streak} · 점수 x${streakMult(streak)}`, W / 2, 20, u * 1.2, '#ffb3e6', 'center');
  // 다이너마이트 개수
  for (let i = 0; i < dyn; i++) {
    const x = W - 18 - i * u * 1.6, y = 12;
    ctx.fillStyle = '#000'; ctx.fillRect(x - 1, y - 1, u * 0.9 + 2, u * 2.2 + 2);
    ctx.fillStyle = '#d0362a'; ctx.fillRect(x, y, u * 0.9, u * 2.2);
    ctx.fillStyle = '#f4ead2'; ctx.fillRect(x, y + u * 0.8, u * 0.9, u * 0.4);
  }
  if (dyn === 0 && !hold) txt('다이너마이트 소진', W - 14, 22, u * 1.1, '#f88', 'right');

  if (hold) drawFuseStick(u); else if (fuseFx.sparks.length || fuseFx.smoke.length) drawFuseFx();

  // 팝업 텍스트
  for (const t of texts) {
    const k = t.t / t.life;
    const sc = t.pop ? (t.t < 0.15 ? 0.6 + t.t / 0.15 * 0.6 : 1.2 - Math.min(0.2, (t.t - 0.15))) : 1;
    ctx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
    txt(t.str, t.x * S, (t.y - t.t * 10) * S, u * 1.3 * t.size * sc, t.col, 'center');
    ctx.globalAlpha = 1;
  }
  if (banner) {
    ctx.globalAlpha = Math.min(1, banner.t * 2) * (0.7 + Math.sin(time * 8) * 0.3);
    txt(banner.str, W / 2, cvs.height * 0.18, u * 1.7, '#ffcf5b', 'center');
    ctx.globalAlpha = 1;
  }
}

// ===== 상태 전환 =====
const startOv = document.getElementById('startOv'), endOv = document.getElementById('endOv'), clearOv = document.getElementById('clearOv');
function startGame() {
  ensureAudio();
  newGame(); state = 'play';
  startOv.classList.add('hidden'); endOv.classList.add('hidden'); clearOv.classList.add('hidden');
}
function dayClear() {
  state = 'clear';
  if (hiss) hiss.g.gain.setTargetAtTime(0, ac.currentTime, 0.03);
  sfx.bonus();
  const extra = dayScore - target;
  nextBonus = Math.min(3, Math.floor(extra / 100));
  const earned = earnCoins();
  document.getElementById('clearTitle').textContent = `${day}일차 성공!`;
  document.getElementById('clearScore').textContent = dayScore;
  document.getElementById('clearStats').innerHTML =
    `목표 ${target}점 · <b>+${extra}</b> 초과<br>총점 ${score}` +
    (nextBonus ? `<br><span class="newbest">초과 점수 보너스! 내일 다이너마이트 +${nextBonus}</span>` : `<br><span style="opacity:.75">100점 더 넘겼으면 내일 다이너마이트 +1</span>`) +
    `<br><span class="earn">🪙 +${earned} (보유 ${meta.coins})</span>` +
    `<br><span style="opacity:.8">내일 목표: ${dayTarget(day + 1)}점</span>`;
  document.getElementById('nextBtn').textContent = `${day + 1}일차 시작`;
  clearOv.classList.remove('hidden');
}
function nextDay() {
  ensureAudio();
  day++; startDay(); state = 'play';
  clearOv.classList.add('hidden');
}
function earnCoins() {
  const c = Math.max(0, Math.floor(dayScore / 5));
  meta.coins += c; saveMeta();
  return c;
}
function retryDay() {
  if (charmsLeft <= 0) return;
  charmsLeft--;
  score = Math.max(0, score - dayScore); // 그날 점수는 다시
  startDay(); state = 'play';
  banner = { str: `🧿 부적의 힘! ${day}일차 다시 · 목표 ${target}점`, t: 2.8 };
  endOv.classList.add('hidden');
}
function endGame(reason) {
  state = 'end';
  const blast = reason === 'blast', murder = reason === 'murder';
  const earned = earnCoins();
  if (hiss) hiss.g.gain.setTargetAtTime(0, ac.currentTime, 0.03);
  const nb = score > best;
  if (nb) best = score;
  bestDay = Math.max(bestDay, day);
  try { localStorage.setItem('dynfish_best', String(best)); localStorage.setItem('dynfish_bestday', String(bestDay)); } catch (e) {}
  document.getElementById('endTitle').textContent = murder ? '🚨 살인자' : blast ? '💥 손에서 터졌다!' : `${day}일차에서 마감`;
  document.getElementById('endScore').textContent = score;
  const k = stats.kinds;
  document.getElementById('endStats').innerHTML =
    (murder ? `<span style="color:#ff6b6b">${day}일차, 튜브 타고 수영하던 사람을 폭파했습니다</span><br>`
     : blast ? `<span style="color:#ff9a8a">${day}일차, 도화선을 너무 오래 쥐고 있었습니다</span><br>`
           : `<span style="color:#ff9a8a">오늘 목표 미달 (${dayScore} / ${target})</span><br>`) +
    (nb ? '<div class="newbest">🏆 최고 기록 갱신!</div>' : `최고 기록 ${best} · 최고 ${bestDay}일차<br>`) +
    `잡은 물고기 <b>${stats.fish}</b>마리 (붕어 ${k.crucian} · 잉어 ${k.carp} · 메기 ${k.catfish}${k.tuna ? ` · 황다랑어 ${k.tuna}` : ''})<br>` +
    `한 방 최다 <b>${stats.bestCombo}</b>마리` +
    (stats.catches.length ? `<br>대어: <b>${stats.catches.join(', ')}</b>` : '') +
    (stats.whaleHits ? `<br><span style="color:#ff8a8a">고래 오폭 ${stats.whaleHits}회</span>` : '') +
    `<br><span class="earn">🪙 +${earned} (보유 ${meta.coins}) · 가게에서 장비를 사면 다음 판이 길어집니다</span>`;
  const cb = document.getElementById('charmBtn');
  lastEndBlast = blast || murder;
  cb.hidden = charmsLeft <= 0 || lastEndBlast; // 손에서 터지거나 사람을 터뜨리면 부적으로도 못 살린다
  cb.textContent = `🧿 부적 사용: ${day}일차 다시 (${charmsLeft}개)`;
  endOv.classList.remove('hidden');
}
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', startGame);
document.getElementById('nextBtn').addEventListener('click', nextDay);
document.getElementById('charmBtn').addEventListener('click', retryDay);

  ['🔥', '도화선 = 폭발 깊이', '도화선은 <b>깊게 → 중간 → 얕게 → 공중</b> 순서로 타 들어가고, 구간이 바뀔 때마다 <b>딸깍</b> 소리가 납니다. 멀리 던질수록 날아가는 동안 더 타니 일찍 놓으세요.'],
  ['🐟', '그림자 읽기', '<b>진한</b> 그림자는 얕은 곳, <b>흐린</b> 그림자는 깊은 곳. 붕어 10점 · 잉어 30점 · 메기 80점, 깊을수록 비쌉니다.'],

  ['📅', '하루와 목표', '하루에 다이너마이트 <b>6개</b>. 그날 <b>목표 점수</b>를 넘기면 다음 날로. 넘긴 점수 <b>100점마다</b> 내일 다이너마이트 +1.'],
  ['🎯', '실력 보상', '한 방에 <b>6마리 이상</b>이면 다이너마이트 환급(12마리 이상 2개). 3마리 이상을 <b>연속</b>으로 잡으면 점수가 최대 2배.'],

let rulePage = 0;
const rulesOv = document.getElementById('rulesOv');
function renderRule() {
  const [ic, hd, tx] = RULES[rulePage];
  document.getElementById('ruleBody').innerHTML = `<div class="big">${ic}</div><div class="hd">${hd}</div><div>${tx}</div>`;
  document.getElementById('ruleDots').innerHTML = RULES.map((_, i) => `<span class="${i === rulePage ? 'on' : ''}"></span>`).join('');
  document.getElementById('rulePrev').textContent = rulePage === 0 ? '닫기' : '‹ 이전';

function closeRules() { rulesOv.classList.add('hidden'); startOv.classList.remove('hidden'); }
document.getElementById('rulesBtn').addEventListener('click', () => { rulePage = 0; renderRule(); startOv.classList.add('hidden'); rulesOv.classList.remove('hidden'); });
document.getElementById('rulePrev').addEventListener('click', () => { if (rulePage === 0) closeRules(); else { rulePage--; renderRule(); } });
document.getElementById('ruleNext').addEventListener('click', () => { if (rulePage === RULES.length - 1) closeRules(); else { rulePage++; renderRule(); } });
// 규칙 카드 좌우로 밀어서 넘기기
(() => {
  const body = document.getElementById('ruleBody'); let x0 = null;
  body.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  body.addEventListener('touchend', e => {
    if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (dx < -40 && rulePage < RULES.length - 1) { rulePage++; renderRule(); }
    else if (dx > 40 && rulePage > 0) { rulePage--; renderRule(); }
  });
})();

// ===== 패널 터치 스크롤 (기본 스크롤이 막히는 환경에서도 손가락으로 밀어 올리기) =====
document.querySelectorAll('.panel').forEach(pn => {
  let y0 = null, st0 = 0, lastY = 0, lastT = 0, v = 0, raf = 0, moved = false;
  pn.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { y0 = null; return; }
    cancelAnimationFrame(raf);
    y0 = lastY = e.touches[0].clientY; st0 = pn.scrollTop; lastT = performance.now(); v = 0; moved = false;
  }, { passive: true });
  pn.addEventListener('touchmove', e => {
    if (y0 === null || pn.scrollHeight <= pn.clientHeight + 1) return;
    const y = e.touches[0].clientY;
    if (!moved && Math.abs(y - y0) < 4) return;
    moved = true;
    e.preventDefault();
    pn.scrollTop = st0 - (y - y0);
    const now = performance.now();
    v = (lastY - y) / Math.max(1, now - lastT) * 16; lastY = y; lastT = now;
  }, { passive: false });
  pn.addEventListener('touchend', () => {
    if (y0 === null) return; y0 = null;
    if (!moved) return;
    const step = () => { if (Math.abs(v) < 0.4) return; pn.scrollTop += v; v *= 0.94; raf = requestAnimationFrame(step); };
    step();
  });
});

// ===== 가게 =====
const shopOv = document.getElementById('shopOv');
let shopBack = null;
function renderShop() {
  document.getElementById('shopCoins').textContent = `🪙 ${meta.coins}`;
  document.getElementById('startCoins').textContent = `🪙 ${meta.coins}`;
  const list = document.getElementById('shopList');
  list.innerHTML = '';
  for (const u of UPGRADES) {
    const lv = meta.up[u.id], max = u.costs.length, cost = u.costs[lv];
    const row = document.createElement('div'); row.className = 'item';
    row.innerHTML = `<div class="info"><div class="nm">${u.name}</div><div class="ds">${u.desc}</div>` +
      `<div class="lv">${'■'.repeat(lv)}${'□'.repeat(max - lv)}</div></div>`;
    const bt = document.createElement('button');
    bt.id = 'buy-' + u.id;
    if (lv >= max) { bt.textContent = '최대'; bt.disabled = true; }
    else { bt.textContent = `🪙 ${cost}`; bt.disabled = meta.coins < cost; }
    bt.addEventListener('click', () => {
      if (meta.up[u.id] >= max || meta.coins < cost) return;
      meta.coins -= cost; meta.up[u.id]++; saveMeta();
      ensureAudio(); sfx.bonus();
      // 진행 중인 판에도 바로 적용 (부적은 다음 판부터)
      applyUpgrades();
      renderShop();
    });
    row.appendChild(bt); list.appendChild(row);
  }
}
document.querySelectorAll('[data-shop]').forEach(btn => btn.addEventListener('click', () => {
  shopBack = btn.closest('.overlay');
  shopBack.classList.add('hidden');
  renderShop(); shopOv.classList.remove('hidden');
}));
document.getElementById('shopClose').addEventListener('click', () => {
  shopOv.classList.add('hidden');
  if (shopBack) shopBack.classList.remove('hidden');
  if (shopBack === endOv) { const cb = document.getElementById('charmBtn'); cb.hidden = charmsLeft <= 0 || lastEndBlast; }
});
renderShop();

// 메뉴 배경용으로 물고기 떼를 미리 띄워둔다
newGame();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  frameDt = dt; updateFuseFx(dt);
  if (state === 'menu' || state === 'end' || state === 'clear') { updateSchools(dt); updateFish(dt); }
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__dyn = { get state() { return state; }, get score() { return score; }, get dyn() { return dyn; },
  get fish() { return fish.length; }, spawnTuna: () => spawnTuna(), spawnSwimmer: () => spawnSwimmer(), placeSwimmer: (x, y) => { spawnSwimmer(); swimmer.x = x; swimmer.y = y; swimmer.sp = 0; }, get swimmer() { return swimmer && { x: swimmer.x, y: swimmer.y, dead: !!swimmer.dead }; }, tunaFish: () => fish.filter(f => f.kind === 'tuna').map(f => ({ x: f.x, y: f.y, d: f.depth })), get day() { return day; }, get swimT() { return swimT; }, setDay: n => { day = n; startDay(); }, get banner() { return banner && banner.str; }, addScore: n => addScore(n), get S() { return S; }, get player() { return player; }, schools: () => schools.map(x => ({ x: x.x, y: x.y, d: x.depth, k: x.kind })), get big() { return big && big.type; }, spawnBig: (t) => { spawnBig(); if (t) { while (big.type !== t) { big = null; spawnBig(); } } } };
