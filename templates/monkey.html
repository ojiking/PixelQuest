<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Monkey Poop Dodge</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1b1b2f;
    color: #fff;
    font-family: "Courier New", monospace;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    box-shadow: 0 0 0 4px #333, 0 0 0 8px #111;
  }
  #back {
    position: fixed; top: 8px; left: 8px;
    color: #ffd166; text-decoration: none; font-size: 14px;
    background: rgba(0,0,0,.5); padding: 4px 8px; border-radius: 4px;
  }
</style>
</head>
<body>
<a id="back" href="{{ url_for('home') }}">&larr; Pixel Quest</a>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
(() => {
  // ---------- 기본 설정 ----------
  const W = 160, H = 240;          // 내부 해상도 (픽셀아트)
  const GROUND = H - 24;           // 바닥 높이
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  canvas.width = W; canvas.height = H;

  function resize() {
    const scale = Math.max(1, Math.floor(Math.min(window.innerWidth / W, (window.innerHeight - 16) / H)));
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- 스프라이트 (문자 → 색상) ----------
  const PAL = {
    '.': null,
    'k': '#1a1a1a', 'b': '#7a4a24', 'B': '#a8683a', 'f': '#f2c79b',
    'w': '#ffffff', 'r': '#e63946', 'y': '#ffd166', 'Y': '#f4a300',
    'p': '#5c3a1e', 'P': '#8b5a2b', 'g': '#2d6a4f', 'G': '#52b788',
    'c': '#4cc9f0', 'C': '#277da1', 's': '#f1c0a0', 'h': '#3a2a1a',
    'o': '#ff8c42'
  };

  const SPR = {
    monkey: [
      "..bbbbbb..",
      ".bbBBBBbb.",
      "bfbBBBBbfb",
      "bfbffffbfb",
      ".bfwkfwkf.",
      ".bffffffb.",
      "..bfrrfb..",
      "...bffb...",
      "..bbbbbb..",
      ".bb.bb.bb.",
    ],
    monkeyThrow: [
      "b.bbbbbb..",
      "bbbBBBBbb.",
      ".fbBBBBbfb",
      "..bffffbfb",
      ".bfwkfwkf.",
      ".bffffffb.",
      "..bfkkfb..",
      "...bffb...",
      "..bbbbbb..",
      ".bb.bb.bb.",
    ],
    hero: [
      "...hhhh...",
      "..hhhhhh..",
      "..ssssss..",
      "..skssks..",
      "..ssssss..",
      "...srrs...",
      "..cccccc..",
      ".scccccs..",
      "..CCCCCC..",
      "..C....C..",
      ".kk....kk.",
    ],
    heroHit: [
      "...hhhh...",
      "..hhhhhh..",
      "..ssssss..",
      "..sxssxs..",
      "..ssssss..",
      "...skks...",
      "..cccccc..",
      ".scccccs..",
      "..CCCCCC..",
      "..C....C..",
      ".kk....kk.",
    ],
    poop: [
      "..p...",
      ".pPp..",
      "pPPPp.",
      "pPpPPp",
      ".pppp.",
    ],
    banana: [
      ".....k",
      "....yY",
      "...yy.",
      "yyyy..",
      ".YYY..",
    ],
    heart: [
      ".rr.rr.",
      "rrrrrrr",
      "rrrrrrr",
      ".rrrrr.",
      "..rrr..",
      "...r...",
    ],
    heartEmpty: [
      ".kk.kk.",
      "k..k..k",
      "k.....k",
      ".k...k.",
      "..k.k..",
      "...k...",
    ],
  };
  PAL['x'] = '#1a1a1a';

  // 스프라이트를 오프스크린 캔버스로 미리 렌더링
  const cache = {};
  function bake(name, flip) {
    const key = name + (flip ? '_f' : '');
    if (cache[key]) return cache[key];
    const rows = SPR[name];
    const c = document.createElement('canvas');
    c.width = rows[0].length; c.height = rows.length;
    const g = c.getContext('2d');
    rows.forEach((row, y) => {
      [...row].forEach((ch, x) => {
        const col = PAL[ch];
        if (!col) return;
        g.fillStyle = col;
        g.fillRect(flip ? c.width - 1 - x : x, y, 1, 1);
      });
    });
    return (cache[key] = c);
  }
  function draw(name, x, y, flip) {
    const img = bake(name, flip);
    ctx.drawImage(img, Math.round(x - img.width / 2), Math.round(y - img.height / 2));
  }

  // ---------- 비트맵 폰트 (3x5) ----------
  const FONT = {
    '0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111',
    '4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001010010010',
    '8':'111101111101111','9':'111101111001111','A':'010101111101101','B':'110101110101110',
    'C':'011100100100011','D':'110101101101110','E':'111100110100111','F':'111100110100100',
    'G':'011100101101011','H':'101101111101101','I':'111010010010111','J':'001001001101010',
    'K':'101101110101101','L':'100100100100111','M':'101111111101101','N':'110101101101101',
    'O':'010101101101010','P':'110101110100100','Q':'010101101110011','R':'110101110101101',
    'S':'011100010001110','T':'111010010010010','U':'101101101101111','V':'101101101101010',
    'W':'101101111111101','X':'101101010101101','Y':'101101010010010','Z':'111001010100111',
    ' ':'000000000000000','!':'010010010000010',':':'000010000010000','-':'000000111000000',
    '.':'000000000000010','/':'001001010100100','?':'111001010000010','+':'000010111010000',
    'x':'000101010101000','<':'001010100010001','>':'100010001010100','=':'000111000111000'
  };
  function text(str, x, y, color = '#fff', align = 'left', scale = 1) {
    str = String(str).toUpperCase();
    const w = str.length * 4 * scale - scale;
    if (align === 'center') x -= Math.floor(w / 2);
    else if (align === 'right') x -= w;
    for (const ch of str) {
      const glyph = FONT[ch] || FONT['?'];
      for (let i = 0; i < 15; i++) {
        if (glyph[i] === '1') {
          const gx = x + (i % 3) * scale, gy = y + Math.floor(i / 3) * scale;
          ctx.fillStyle = '#000';
          ctx.fillRect(gx + scale, gy + scale, scale, scale);
          ctx.fillStyle = color;
          ctx.fillRect(gx, gy, scale, scale);
        }
      }
      x += 4 * scale;
    }
  }

  // ---------- 사운드 ----------
  let actx = null;
  function beep(freq, dur = 0.08, type = 'square', vol = 0.06, slide = 0) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      if (slide) o.frequency.linearRampToValueAtTime(freq + slide, actx.currentTime + dur);
      g.gain.value = vol;
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) { /* 사운드 미지원 */ }
  }
  const sfx = {
    throw: () => beep(300, 0.1, 'triangle', 0.05, 200),
    splat: () => beep(90, 0.15, 'sawtooth', 0.05, -40),
    hit:   () => beep(140, 0.35, 'square', 0.08, -100),
    pick:  () => { beep(660, 0.08); setTimeout(() => beep(990, 0.1), 70); },
    over:  () => { beep(300, 0.2); setTimeout(() => beep(200, 0.2), 200); setTimeout(() => beep(120, 0.4), 400); },
    level: () => { beep(520, 0.08); setTimeout(() => beep(660, 0.08), 80); setTimeout(() => beep(880, 0.12), 160); },
  };

  // ---------- 입력 ----------
  const keys = {};
  let touchX = null;
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['ArrowLeft','ArrowRight','Space','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();
    if (e.code === 'Space' || e.code === 'Enter') onAction();
    if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  function canvasX(clientX) {
    const r = canvas.getBoundingClientRect();
    return (clientX - r.left) / r.width * W;
  }
  canvas.addEventListener('pointerdown', e => { touchX = canvasX(e.clientX); onAction(); });
  canvas.addEventListener('pointermove', e => { if (touchX !== null || e.pointerType === 'mouse') touchX = canvasX(e.clientX); });
  window.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') touchX = null; });
  canvas.addEventListener('pointerleave', () => { touchX = null; });

  // ---------- 게임 상태 ----------
  let state = 'title';   // title | play | pause | over
  let hero, monkeys, poops, splats, items, particles, popups;
  let score, level, time, lives, dodged, combo, invuln, shake, nextItem;
  let best = 0;
  try { best = +localStorage.getItem('monkeyPoopBest') || 0; } catch (e) {}

  function reset() {
    hero = { x: W / 2, y: GROUND - 6, vx: 0, face: 1, slow: 0 };
    monkeys = [makeMonkey(W / 2)];
    poops = []; splats = []; items = []; particles = []; popups = [];
    score = 0; level = 1; time = 0; lives = 3; dodged = 0; combo = 0;
    invuln = 0; shake = 0; nextItem = 8;
  }

  function makeMonkey(x) {
    return { x, y: 30, tx: x, cd: 1.5 + Math.random(), anim: 0, throwT: 0, face: 1 };
  }

  function onAction() {
    if (state === 'title' || state === 'over') { reset(); state = 'play'; sfx.level(); }
    else if (state === 'pause') state = 'play';
  }
  function togglePause() {
    if (state === 'play') state = 'pause';
    else if (state === 'pause') state = 'play';
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });

  // ---------- 난이도 ----------
  function difficulty() {
    return {
      throwGap: Math.max(0.35, 1.6 - level * 0.12),   // 던지기 간격
      speed: 1 + level * 0.08,                         // 투사체 속도 배율
      spread: level >= 3 ? (level >= 6 ? 3 : 2) : 1,   // 한번에 던지는 개수
      monkeys: Math.min(3, 1 + Math.floor((level - 1) / 3)),
    };
  }

  // ---------- 업데이트 ----------
  function throwPoop(m) {
    const d = difficulty();
    const n = Math.random() < 0.35 ? d.spread : 1;
    // 플레이어 위치를 예측해서 조준 (약간의 오차 포함)
    const lead = hero.vx * 0.6;
    const flight = (0.9 + Math.random() * 0.5) / d.speed;
    for (let i = 0; i < n; i++) {
      const offset = (i - (n - 1) / 2) * 22;
      const targetX = Math.max(4, Math.min(W - 4, hero.x + lead + offset + (Math.random() - 0.5) * 20));
      const g = 220 * d.speed * d.speed;
      const dy = GROUND - 2 - (m.y + 2);
      const vy = (dy - 0.5 * g * flight * flight) / flight;
      poops.push({
        x: m.x, y: m.y + 2, vx: (targetX - m.x) / flight, vy, g,
        rot: 0, big: Math.random() < 0.12 && level >= 2
      });
    }
    m.throwT = 0.25;
    m.face = hero.x < m.x ? -1 : 1;
    sfx.throw();
  }

  function update(dt) {
    time += dt;
    const d = difficulty();

    // 레벨업 (15초마다)
    const newLevel = 1 + Math.floor(time / 15);
    if (newLevel > level) {
      level = newLevel;
      popups.push({ x: W / 2, y: H / 2 - 20, t: 1.6, str: 'LEVEL ' + level, color: '#ffd166', big: true });
      sfx.level();
    }
    while (monkeys.length < d.monkeys) monkeys.push(makeMonkey(Math.random() * (W - 30) + 15));

    // 플레이어 이동
    const accel = 900, maxV = hero.slow > 0 ? 45 : 95;
    let dir = 0;
    if (keys.ArrowLeft || keys.KeyA) dir -= 1;
    if (keys.ArrowRight || keys.KeyD) dir += 1;
    if (touchX !== null && dir === 0) {
      const diff = touchX - hero.x;
      if (Math.abs(diff) > 2) dir = Math.sign(diff) * Math.min(1, Math.abs(diff) / 12);
    }
    if (dir) {
      hero.vx += dir * accel * dt;
      hero.face = Math.sign(dir);
    } else {
      hero.vx *= Math.pow(0.0005, dt);
    }
    hero.vx = Math.max(-maxV, Math.min(maxV, hero.vx));
    hero.x += hero.vx * dt;
    if (hero.x < 6) { hero.x = 6; hero.vx = 0; }
    if (hero.x > W - 6) { hero.x = W - 6; hero.vx = 0; }
    hero.slow = Math.max(0, hero.slow - dt);

    // 똥 웅덩이 밟으면 미끄럽고 느려짐
    for (const s of splats) {
      if (Math.abs(s.x - hero.x) < s.w / 2 + 2) hero.slow = 0.15;
    }

    // 원숭이
    monkeys.forEach(m => {
      m.anim += dt;
      if (Math.abs(m.tx - m.x) < 2) m.tx = 12 + Math.random() * (W - 24);
      m.x += Math.sign(m.tx - m.x) * Math.min(Math.abs(m.tx - m.x), (30 + level * 3) * dt);
      m.throwT = Math.max(0, m.throwT - dt);
      m.cd -= dt;
      if (m.cd <= 0) {
        throwPoop(m);
        m.cd = d.throwGap * (0.7 + Math.random() * 0.6) * monkeys.length;
      }
    });

    // 투사체
    for (let i = poops.length - 1; i >= 0; i--) {
      const p = poops[i];
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += dt * 10;
      const r = p.big ? 5 : 3;
      // 충돌
      if (invuln <= 0 && Math.abs(p.x - hero.x) < r + 3 && Math.abs(p.y - (hero.y - 1)) < r + 5) {
        poops.splice(i, 1);
        hurt(p);
        continue;
      }
      if (p.y >= GROUND - 2) {
        poops.splice(i, 1);
        splat(p.x, p.big);
        dodged++; combo++;
        const gain = 10 * (1 + Math.floor(combo / 10));
        score += gain;
        if (combo > 0 && combo % 10 === 0) {
          popups.push({ x: hero.x, y: hero.y - 16, t: 1, str: combo + ' COMBO!', color: '#52b788' });
        }
      }
    }

    // 웅덩이 소멸
    for (let i = splats.length - 1; i >= 0; i--) {
      splats[i].t -= dt;
      if (splats[i].t <= 0) splats.splice(i, 1);
    }

    // 아이템 (바나나: 체력 회복 / 점수)
    nextItem -= dt;
    if (nextItem <= 0) {
      items.push({ x: 10 + Math.random() * (W - 20), y: -6, vy: 30, t: 6 });
      nextItem = 10 + Math.random() * 8;
    }
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (it.y < GROUND - 4) it.y += it.vy * dt; else it.t -= dt;
      if (Math.abs(it.x - hero.x) < 7 && Math.abs(it.y - hero.y) < 9) {
        items.splice(i, 1);
        if (lives < 3) { lives++; popups.push({ x: it.x, y: it.y - 10, t: 1, str: '+1 LIFE', color: '#e63946' }); }
        else { score += 100; popups.push({ x: it.x, y: it.y - 10, t: 1, str: '+100', color: '#ffd166' }); }
        sfx.pick();
        continue;
      }
      if (it.t <= 0) items.splice(i, 1);
    }

    // 생존 점수
    score += dt * 5;
    invuln = Math.max(0, invuln - dt);
    shake = Math.max(0, shake - dt);
    updateFx(dt);
  }

  function splat(x, big) {
    splats.push({ x, w: big ? 16 : 9, t: big ? 6 : 4 });
    for (let i = 0; i < (big ? 10 : 5); i++) {
      particles.push({ x, y: GROUND - 2, vx: (Math.random() - 0.5) * 80, vy: -Math.random() * 70, t: 0.5, c: Math.random() < 0.5 ? '#5c3a1e' : '#8b5a2b' });
    }
    sfx.splat();
  }

  function hurt(p) {
    lives -= p.big ? 2 : 1;
    combo = 0;
    invuln = 1.5;
    shake = 0.3;
    for (let i = 0; i < 16; i++) {
      particles.push({ x: hero.x, y: hero.y - 4, vx: (Math.random() - 0.5) * 120, vy: -Math.random() * 100, t: 0.7, c: Math.random() < 0.5 ? '#5c3a1e' : '#8b5a2b' });
    }
    popups.push({ x: hero.x, y: hero.y - 16, t: 1, str: 'EWW!', color: '#ff8c42' });
    sfx.hit();
    if (lives <= 0) {
      lives = 0;
      state = 'over';
      score = Math.floor(score);
      if (score > best) {
        best = score;
        try { localStorage.setItem('monkeyPoopBest', best); } catch (e) {}
      }
      setTimeout(sfx.over, 200);
    }
  }

  function updateFx(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += 300 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.t -= dt;
      if (p.y > GROUND) { p.y = GROUND; p.vy = 0; p.vx *= 0.5; }
      if (p.t <= 0) particles.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      popups[i].t -= dt; popups[i].y -= 15 * dt;
      if (popups[i].t <= 0) popups.splice(i, 1);
    }
  }

  // ---------- 렌더 ----------
  function drawBackground() {
    // 하늘 그라데이션 (단계별 밴드)
    const sky = ['#4cc9f0', '#5ccff2', '#6dd5f3', '#80dbf5', '#94e1f7', '#a9e7f9'];
    const bh = Math.ceil(GROUND / sky.length);
    sky.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(0, i * bh, W, bh); });

    // 구름
    ctx.fillStyle = '#ffffff';
    const cx = (time * 4) % (W + 40) - 20;
    [[cx, 70], [(cx + 90) % (W + 40) - 20, 105]].forEach(([x, y]) => {
      ctx.fillRect(x, y, 18, 4); ctx.fillRect(x + 4, y - 3, 10, 3);
    });

    // 정글 나무 (뒤)
    ctx.fillStyle = '#2d6a4f';
    for (let x = 0; x < W; x += 20) ctx.fillRect(x, GROUND - 30 - ((x * 7) % 13), 14, 40);
    ctx.fillStyle = '#40916c';
    for (let x = 8; x < W; x += 24) ctx.fillRect(x, GROUND - 18 - ((x * 5) % 9), 12, 20);

    // 원숭이가 앉은 나뭇가지
    ctx.fillStyle = '#5c3a1e';
    ctx.fillRect(0, 36, W, 4);
    ctx.fillStyle = '#7a4a24';
    ctx.fillRect(0, 36, W, 1);
    // 잎사귀 캐노피
    for (let x = 0; x < W; x += 8) {
      ctx.fillStyle = (x / 8) % 2 ? '#2d6a4f' : '#52b788';
      ctx.fillRect(x, 0, 8, 14 + ((x * 3) % 7));
    }
    ctx.fillStyle = '#1b4332';
    for (let x = 4; x < W; x += 16) ctx.fillRect(x, 12 + ((x * 3) % 7), 4, 4);
    // 덩굴
    ctx.fillStyle = '#40916c';
    [14, 58, 112, 146].forEach((x, i) => ctx.fillRect(x, 14, 1, 18 + (i % 2) * 6));

    // 땅
    ctx.fillStyle = '#6a994e'; ctx.fillRect(0, GROUND, W, 3);
    ctx.fillStyle = '#9c6644'; ctx.fillRect(0, GROUND + 3, W, H - GROUND - 3);
    ctx.fillStyle = '#7f5539';
    for (let x = 0; x < W; x += 6) ctx.fillRect(x + ((x * 7) % 4), GROUND + 7 + ((x * 3) % 10), 2, 1);
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate(Math.round((Math.random() - 0.5) * 4), Math.round((Math.random() - 0.5) * 4));

    drawBackground();

    if (state !== 'title') {
      // 웅덩이
      splats.forEach(s => {
        ctx.globalAlpha = Math.min(1, s.t);
        ctx.fillStyle = '#5c3a1e';
        ctx.fillRect(Math.round(s.x - s.w / 2), GROUND - 1, s.w, 2);
        ctx.fillStyle = '#8b5a2b';
        ctx.fillRect(Math.round(s.x - s.w / 2 + 2), GROUND - 2, s.w - 4, 1);
        ctx.globalAlpha = 1;
      });

      // 아이템
      items.forEach(it => {
        if (it.t < 2 && Math.floor(it.t * 8) % 2) return;
        draw('banana', it.x, it.y);
      });

      // 원숭이
      monkeys.forEach(m => {
        const bob = Math.floor(m.anim * 4) % 2;
        draw(m.throwT > 0 ? 'monkeyThrow' : 'monkey', m.x, m.y - 1 - bob, m.face < 0);
        // 꼬리
        ctx.fillStyle = '#7a4a24';
        ctx.fillRect(Math.round(m.x + 4 * -m.face), Math.round(m.y + 4), 1, 6);
      });

      // 조준 그림자 (떨어질 위치 표시)
      poops.forEach(p => {
        const t = solveLanding(p);
        const lx = p.x + p.vx * t;
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        const w = p.big ? 8 : 5;
        ctx.fillRect(Math.round(lx - w / 2), GROUND - 1, w, 1);
      });

      // 플레이어
      if (!(invuln > 0 && Math.floor(invuln * 12) % 2)) {
        const walk = Math.abs(hero.vx) > 10 ? Math.floor(time * 12) % 2 : 0;
        draw(state === 'over' ? 'heroHit' : 'hero', hero.x, hero.y - walk, hero.face < 0);
      }

      // 똥
      poops.forEach(p => {
        if (p.big) {
          ctx.save();
          ctx.translate(Math.round(p.x), Math.round(p.y));
          ctx.scale(2, 2);
          ctx.drawImage(bake('poop'), -3, -3);
          ctx.restore();
        } else {
          draw('poop', p.x, p.y, Math.floor(p.rot) % 2 === 0);
        }
        // 냄새 파티클
        if (Math.random() < 0.2) particles.push({ x: p.x + (Math.random() - 0.5) * 4, y: p.y - 4, vx: 0, vy: -20, t: 0.3, c: '#9acd32' });
      });

      // 파티클
      particles.forEach(p => { ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1); });

      // 팝업 텍스트
      popups.forEach(p => text(p.str, Math.round(p.x), Math.round(p.y), p.color, 'center', p.big ? 2 : 1));

      // HUD
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0, H - 18, W, 18);
      for (let i = 0; i < 3; i++) draw(i < lives ? 'heart' : 'heartEmpty', 8 + i * 9, H - 9);
      text('SCORE ' + Math.floor(score), W - 4, H - 15, '#fff', 'right');
      text('LV ' + level + '  BEST ' + Math.max(best, Math.floor(score)), W - 4, H - 8, '#ffd166', 'right');
    }

    // 화면 오버레이
    if (state === 'title') {
      draw('monkey', W / 2, 30);
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(10, 60, W - 20, 120);
      text('MONKEY', W / 2, 70, '#ffd166', 'center', 3);
      text('POOP DODGE', W / 2, 90, '#a8683a', 'center', 2);
      draw('poop', W / 2 - 30, 112); draw('poop', W / 2, 108); draw('poop', W / 2 + 30, 112);
      text('<- -> OR A/D TO MOVE', W / 2, 126, '#fff', 'center');
      text('TOUCH: DRAG TO MOVE', W / 2, 134, '#fff', 'center');
      text('BANANA = +1 LIFE', W / 2, 144, '#ffd166', 'center');
      if (Math.floor(performance.now() / 500) % 2) text('PRESS SPACE / TAP', W / 2, 160, '#52b788', 'center');
      if (best) text('BEST ' + best, W / 2, 170, '#fff', 'center');
      draw('hero', W / 2, GROUND - 6);
    } else if (state === 'pause') {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, W, H);
      text('PAUSED', W / 2, H / 2 - 10, '#fff', 'center', 2);
      text('TAP OR P TO RESUME', W / 2, H / 2 + 8, '#ffd166', 'center');
    } else if (state === 'over') {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(10, 70, W - 20, 96);
      text('GAME OVER', W / 2, 80, '#e63946', 'center', 2);
      text('SCORE ' + Math.floor(score), W / 2, 102, '#fff', 'center');
      text('DODGED ' + dodged + '  LV ' + level, W / 2, 112, '#fff', 'center');
      text('BEST ' + best, W / 2, 122, '#ffd166', 'center');
      if (Math.floor(score) >= best && score > 0) text('NEW RECORD!', W / 2, 134, '#52b788', 'center');
      if (Math.floor(performance.now() / 500) % 2) text('SPACE / TAP TO RETRY', W / 2, 150, '#fff', 'center');
    }
    ctx.restore();
  }

  // 투사체가 바닥에 닿을 때까지의 시간
  function solveLanding(p) {
    const a = 0.5 * p.g, b = p.vy, c = p.y - (GROUND - 2);
    const disc = b * b - 4 * a * c;
    if (disc < 0) return 0;
    return Math.max(0, (-b + Math.sqrt(disc)) / (2 * a));
  }

  // ---------- 메인 루프 ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (state === 'play') update(dt);
    else if (state === 'over') updateFx(dt);
    render();
    requestAnimationFrame(loop);
  }
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
